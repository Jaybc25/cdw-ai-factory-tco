name: Patch RTX report labels once
on:
  push:
    branches: [fix/rtx-results-ux]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rtx-results-ux
          fetch-depth: 0
      - run: python scripts/patch_rtx_report_labels_once.py
      - run: |
          rm .github/workflows/patch-rtx-report-labels.yml scripts/patch_rtx_report_labels_once.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/GpuSizingCalculator.jsx .github/workflows/patch-rtx-report-labels.yml scripts/patch_rtx_report_labels_once.py
          git commit -m "Label selected RTX correctly in report and audit"
          git push origin HEAD:fix/rtx-results-ux
