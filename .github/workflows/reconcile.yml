name: Reconcile registries

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "data/**"

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run reconciliation
        run: python3 reconcile_registries.py
