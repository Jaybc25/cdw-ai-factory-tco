name: Resolve stale record leftovers

on:
  push:
    branches:
      - docs/resolve-stale-record-leftovers-2026-09-05
    paths:
      - .github/workflows/resolve-stale-record-leftovers.yml

permissions:
  contents: write

jobs:
  update-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/resolve-stale-record-leftovers-2026-09-05
      - name: Resolve stale record leftovers
        run: |
          python scripts/resolve_stale_record_leftovers.py
          rm .github/workflows/resolve-stale-record-leftovers.yml scripts/resolve_stale_record_leftovers.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: resolve stale current-state leftovers"
          git push origin HEAD:docs/resolve-stale-record-leftovers-2026-09-05

