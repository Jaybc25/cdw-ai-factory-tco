name: TCO PDF layout experiment

on:
  push:
    branches:
      - experiment/tco-pdf-layout
    paths:
      - '.github/workflows/tco-pdf-layout-experiment.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/tco-pdf-layout
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply branch-only PDF layout changes
        run: python3 scripts/apply_tco_pdf_layout_experiment.py
      - name: Validate shared pricing registry
        run: node scripts/validate_pricing_registry.mjs
      - name: Production build
        run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract TCO workbook snapshot
        run: python3 scripts/extract_tco_workbook_snapshot.py
      - name: Run TCO Excel-to-JavaScript parity
        run: node scripts/run_tco_parity.mjs
      - name: Install Playwright
        run: npm install --no-save --no-package-lock @playwright/test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start local preview
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/tco-preview.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/tco >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/tco-preview.log
          exit 1
      - name: Render default-scenario experiment PDF
        run: node scripts/render_tco_report_experiment.mjs artifacts/tco-report-experiment.pdf
      - name: Upload comparison artifact
        uses: actions/upload-artifact@v4
        with:
          name: tco-report-layout-experiment
          path: artifacts/tco-report-experiment.pdf
          if-no-files-found: error
          retention-days: 14
      - name: Commit branch-only layout changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/TcoCalculator.jsx
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "experiment: improve TCO PDF layout"
          git push origin HEAD:experiment/tco-pdf-layout
