name: Finalize AI Factory Suite 2026.09 release bookkeeping

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/create-release-2026-09.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Mark release as published in changelog
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("CHANGELOG.md")
          text = p.read_text()
          old = "- This assurance baseline is the candidate for the first formal known-good suite release, `v2026.09` / `AI Factory Suite 2026.09`, after the cleaned repository passes the final quality gate."
          new = "- Released as `v2026.09` / `AI Factory Suite 2026.09` from validated commit `31fdb2ff2a321f6101bfa72d3c45b4c31aa3a0eb` after the cleaned repository passed the production build, 20/20 TCO Excel-to-JavaScript parity gate, and 13/13 live Vercel regression suite."
          if text.count(old) != 1:
              raise SystemExit("Expected release-candidate changelog line was not found exactly once")
          p.write_text(text.replace(old, new, 1))
          PY

      - name: Remove one-time release workflow
        run: git rm .github/workflows/create-release-2026-09.yml

      - name: Verify final bookkeeping diff
        run: git diff --check && git diff -- CHANGELOG.md .github/workflows/create-release-2026-09.yml

      - name: Commit cleanup
        run: |
          git config user.name "ai-factory-quality-bot"
          git config user.email "actions@github.com"
          git add CHANGELOG.md .github/workflows/create-release-2026-09.yml
          git commit -m "release: finalize AI Factory Suite 2026.09"
          git push
