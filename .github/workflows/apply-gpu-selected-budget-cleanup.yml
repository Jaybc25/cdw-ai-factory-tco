name: Apply GPU selected-budget cleanup

on:
  workflow_dispatch: {}
  push:
    branches: [gpu-sizing-selected-budget-cleanup]
    paths:
      - ".github/scripts/apply_gpu_selected_budget_cleanup.py"
      - ".github/workflows/apply-gpu-selected-budget-cleanup.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpu-sizing-selected-budget-cleanup
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply patch
        run: python .github/scripts/apply_gpu_selected_budget_cleanup.py
      - name: Validate staged contract
        run: node scripts/validate_gpu_selected_budget_and_phase2_cleanup.mjs
      - name: Commit implementation and remove temporary scaffolding
        run: |
          rm .github/scripts/apply_gpu_selected_budget_cleanup.py
          rm .github/workflows/apply-gpu-selected-budget-cleanup.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/GpuSizingCalculator.jsx CHANGELOG.md scripts/validate_gpu_selected_budget_and_phase2_cleanup.mjs .github/scripts/apply_gpu_selected_budget_cleanup.py .github/workflows/apply-gpu-selected-budget-cleanup.yml
          git commit -m "fix: align GPU budget with selected TCO configuration"
          git push