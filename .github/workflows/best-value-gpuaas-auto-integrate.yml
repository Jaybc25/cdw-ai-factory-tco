name: Best-Value GPUaaS branch integrator

on:
  push:
    branches: [feature/best-value-gpuaas-v1]
    paths:
      - "scripts/apply_best_value_gpuaas_integration.mjs"
      - "src/BestValueGpuAasPanel.jsx"
      - "src/bestValueGpuaas.js"
      - ".github/workflows/best-value-gpuaas-auto-integrate.yml"

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message, '[best-value-auto]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/best-value-gpuaas-v1
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Apply targeted TCO integration patch
        run: node scripts/apply_best_value_gpuaas_integration.mjs

      - name: Install dependencies
        run: npm ci

      - name: Production build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: branch-integration-placeholder
        run: npm run build

      - name: Validate Best-Value GPUaaS helper
        run: node scripts/validate_best_value_gpuaas.mjs

      - name: Validate Best-Value GPUaaS UI contract
        run: node scripts/validate_best_value_gpuaas_ui.mjs

      - name: Re-run TCO handoff ownership guard
        run: node scripts/validate_tco_handoff.mjs

      - name: Commit integrated calculator only if changed
        run: |
          if git diff --quiet -- src/TcoCalculator.jsx; then
            echo "TcoCalculator.jsx already integrated"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/TcoCalculator.jsx
          git commit -m "Integrate Best-Value GPUaaS into TCO [best-value-auto]"
          git push origin HEAD:feature/best-value-gpuaas-v1
