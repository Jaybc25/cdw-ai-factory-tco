name: PR31 apply Nemotron context contract

on:
  push:
    branches: [hybrid-sequence-state-methodology]
    paths:
      - ".github/workflows/pr31-apply-nemotron-context.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hybrid-sequence-state-methodology
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/apply_pr31_nemotron_context_contract.mjs
      - name: Commit context contract
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/model_catalog_tranche_1_qualification.json data/model_catalog_policy.json scripts/validate_model_tranche_1.mjs
          git diff --cached --check
          git commit -m "Represent Nemotron base and extended context explicitly"
          git push origin HEAD:hybrid-sequence-state-methodology
