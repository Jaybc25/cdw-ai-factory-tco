name: Temporary publish 2026.09.1

on:
  push:
    branches:
      - release/publish-2026.09.1

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SHA: 418393a7cabb629bc2f92fbcfd5b45a70a16e770
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/publish-2026.09.1

      - name: Verify release target is still current main
        run: |
          ACTUAL=$(git ls-remote origin refs/heads/main | cut -f1)
          test "$ACTUAL" = "$RELEASE_SHA"

      - name: Verify release does not already exist
        run: |
          if gh release view v2026.09.1 >/dev/null 2>&1; then
            echo "v2026.09.1 already exists; refusing to recreate or move it"
            exit 1
          fi

      - name: Create GitHub Release and immutable release tag
        run: |
          cat > /tmp/release-notes.md <<'EOF'
          # AI Factory Suite 2026.09.1

          ## Release identity

          - Release: AI Factory Suite 2026.09.1
          - Tag: `v2026.09.1`
          - Exact release commit: `418393a7cabb629bc2f92fbcfd5b45a70a16e770`
          - Previous stable: `v2026.09` at `31fdb2ff2a321f6101bfa72d3c45b4c31aa3a0eb`
          - Package metadata: `2026.9.1`
          - Release date: September 4, 2026

          ## Status

          - Source-verified: YES
          - Live-verified: YES
          - Externally approved: NOT ASSERTED. CDW publication/branding approval remains a separate process from technical release validation.

          ## Material changes since v2026.09

          - Promoted the approved customer-facing print layouts for TCO, ROI, GPU Sizing, Model Advisor, and Readiness.
          - Fixed the GPU Sizing working-day-hours mobile editing defect.
          - Added the shared pricing registry and permanent precision/drift validation, including the exact AWS B200 reserved-rate guard.
          - Added canonical shared model context across Model Advisor, GPU Sizing, and TCO.
          - Hardened legacy and Custom model migration plus refresh/Back/Forward persistence.
          - Corrected GPU Sizing -> TCO ownership and state precedence: technical facts follow GPU Sizing, TCO-owned economic assumptions survive, explicit cloud-comparison overrides remain explicit, and class/system-specific rates remain scoped correctly.
          - Structurally locked the workload-mode on-prem technical target to the GPU Sizing recommendation while preserving TCO resilience/economic assumptions separately.
          - Hardened Client Summary SafeImageInput with decoded dimension and total-pixel limits in addition to existing type/signature/size checks.
          - Completed a deliberate pre-release cross-tool state-precedence pass. It found and fixed a real Model Advisor -> GPU Sizing Training-mode stale-model/provenance defect and added permanent cross-tool regression coverage.
          - Updated the durable project documentation and release procedures for the current architecture and assurance state.

          ## Validation evidence

          - Release-prep PR #14 quality gate: PASS, workflow run `33909916200`.
          - Exact merged release tree quality gate: PASS, workflow run `33910098584`.
          - Exact release commit Vercel deployment: SUCCESS.
          - TCO Excel-to-JavaScript canonical parity: 20/20.
          - Permanent validators passed for shared pricing, shared model registry, GPU Sizing -> TCO handoff ownership, SafeImageInput resource bounds, workbook structure, PR-local cross-tool browser journeys, and live Vercel browser regression.
          - Individual report layouts included in this release were human-reviewed before their approved states were promoted.

          ## Scope and limitations

          - No claim is made here that every credentialed external side effect was freshly re-tested solely for this metadata/tag step. Authentication, Supabase download-event side effects, Slack delivery, and similar connected-service checks remain release-scope/manual checks when those paths materially change.
          - Green CI means the asserted checks passed. It is not a claim that unknown defects are impossible.

          ## Known open items carried forward

          - Combined Summary: curated per-tool presentation schema, deliberate pagination, clearer customer-facing labels, and reproducible 1-through-5-tool fixtures/regression.
          - NIM compatibility remains manual until a production NVIDIA endpoint is validated.
          - Controlled Vite/esbuild upgrade remains separate.
          - Controlled React Router v7 migration remains separate.
          - Ongoing cloud/on-prem pricing refresh cadence remains active.
          - External CDW publication/branding approval remains separate from this internal technical release.

          ## Recovery identity

          To restore this exact known-good release, use tag `v2026.09.1` or commit `418393a7cabb629bc2f92fbcfd5b45a70a16e770`. Do not move the tag after creation.
          EOF

          gh release create v2026.09.1 \
            --target "$RELEASE_SHA" \
            --title "AI Factory Suite 2026.09.1" \
            --notes-file /tmp/release-notes.md \
            --latest

      - name: Verify tag target
        run: |
          git fetch --tags origin
          TAG_SHA=$(git rev-list -n 1 v2026.09.1)
          test "$TAG_SHA" = "$RELEASE_SHA"

      - name: Remove temporary publisher from helper branch
        run: |
          rm .github/workflows/temporary-publish-2026-09-1.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/temporary-publish-2026-09-1.yml
          git commit -m "chore: remove temporary release publisher"
          git push origin HEAD:release/publish-2026.09.1
