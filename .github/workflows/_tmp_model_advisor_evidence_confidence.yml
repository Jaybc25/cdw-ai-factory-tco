name: Temporary Model Advisor evidence-confidence patch

on:
  push:
    branches: [model-advisor-evidence-confidence]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: model-advisor-evidence-confidence
      - name: Apply patch
        run: python3 .github/scripts/sync_model_advisor_evidence_confidence.py
      - name: Remove temporary helper
        run: rm .github/scripts/sync_model_advisor_evidence_confidence.py .github/workflows/_tmp_model_advisor_evidence_confidence.yml
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: disclose Model Advisor benchmark evidence confidence"
          git push origin HEAD:model-advisor-evidence-confidence
