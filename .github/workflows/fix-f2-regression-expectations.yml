name: Fix F2 regression expectations
on:
  push:
    branches:
      - fix/f2-capacity-authority
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply regression expectation fix
        run: python scripts/fix-f2-regression-expectations.py
      - name: Commit regression fix
        run: |
          rm scripts/fix-f2-regression-expectations.py
          rm .github/workflows/fix-f2-regression-expectations.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/tco-handoff-ownership.spec.js scripts/fix-f2-regression-expectations.py .github/workflows/fix-f2-regression-expectations.yml
          git commit -m "Align F2 browser regressions with workload capacity authority"
          git push
