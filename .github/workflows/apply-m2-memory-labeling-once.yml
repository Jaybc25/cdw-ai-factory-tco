name: Apply M2 memory labeling once

on:
  push:
    branches: [fix/m2-training-memory-model]
    paths:
      - "scripts/apply-m2-memory-labeling.py"
      - ".github/workflows/apply-m2-memory-labeling-once.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/m2-training-memory-model
      - name: Apply M2 labeling patch
        run: python3 scripts/apply-m2-memory-labeling.py
      - name: Remove one-shot patch files
        run: git rm scripts/apply-m2-memory-labeling.py .github/workflows/apply-m2-memory-labeling-once.yml
      - name: Commit M2 labeling clarification
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modelSizingMethodology.js src/GpuSizingCalculator.jsx
          git commit -m "Clarify M2 resident-state memory scope"
          git push
