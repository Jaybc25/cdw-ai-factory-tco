name: Temporary F1 GB300 cloud-class fix

on:
  push:
    branches:
      - fix/f1-gb300-cloud-class-handoff
    paths:
      - ".github/workflows/_temp-f1-gb300-cloud-class-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/f1-gb300-cloud-class-handoff
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply narrow F1 completion patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          tco = Path("src/TcoCalculator.jsx")
          text = tco.read_text()
          old_comment = '// they differ (B200 -> B200-class, GB200 NVL72 -> GB200). Identity otherwise.'
          new_comment = '// they differ (B200 -> B200-class, GB200 NVL72 -> GB200, GB300 NVL72 -> GB300). Identity otherwise.'
          old_map = 'const GPU_SIZING_CLASS_TO_TCO_CLASS = { "B200": "B200-class", "GB200 NVL72": "GB200", "Rubin NVL8": "Rubin NVL8", "Vera Rubin NVL72": "Vera Rubin NVL72" };'
          new_map = 'const GPU_SIZING_CLASS_TO_TCO_CLASS = { "B200": "B200-class", "GB200 NVL72": "GB200", "GB300 NVL72": "GB300", "Rubin NVL8": "Rubin NVL8", "Vera Rubin NVL72": "Vera Rubin NVL72" };'
          if old_comment not in text or old_map not in text:
              raise SystemExit("Expected TCO normalization text not found")
          text = text.replace(old_comment, new_comment, 1).replace(old_map, new_map, 1)
          tco.write_text(text)

          test = Path("tests/e2e/gpu-sizing-architecture-aware.spec.js")
          text = test.read_text()
          old = '''  const saved = await waitForTcoSession(page, {
    ownSys: "DGX GB300 NVL-72",
    gpuSizingCount: 72,
    sourceClass: "GB300 NVL72",
    gpuSizingBasis: "recommended",
    modelId: "deepseek-v4-pro-0813",
  });'''
          new = '''  const saved = await waitForTcoSession(page, {
    ownSys: "DGX GB300 NVL-72",
    gpuClass: "GB300",
    gpuSizingCount: 72,
    sourceClass: "GB300 NVL72",
    gpuSizingBasis: "recommended",
    modelId: "deepseek-v4-pro-0813",
  });'''
          if old not in text:
              raise SystemExit("Expected GB300 regression block not found")
          test.write_text(text.replace(old, new, 1))
          PY
      - name: Remove temporary workflow
        run: rm .github/workflows/_temp-f1-gb300-cloud-class-fix.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/TcoCalculator.jsx tests/e2e/gpu-sizing-architecture-aware.spec.js .github/workflows/_temp-f1-gb300-cloud-class-fix.yml
          git commit -m "Fix GB300 cloud class handoff"
          git push origin HEAD:fix/f1-gb300-cloud-class-handoff
