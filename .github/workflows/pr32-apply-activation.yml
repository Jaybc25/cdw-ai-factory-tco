name: PR32 apply activation patch

on:
  push:
    branches: [activate-hybrid-model-tranche]
    paths:
      - ".github/workflows/pr32-apply-activation.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: activate-hybrid-model-tranche
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply exact activation patch
        run: node scripts/apply_pr32_activation_patch.mjs
      - name: Commit activation changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modelRegistry.js src/modelAdvisorEngine.js
          git diff --cached --check
          if git diff --cached --quiet; then exit 1; fi
          git commit -m "Promote hybrid models into runtime and Advisor licensing"
          git push origin HEAD:activate-hybrid-model-tranche
