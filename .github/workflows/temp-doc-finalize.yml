name: Temporary documentation finalizer

on:
  push:
    branches: [docs/release-catchup-2026-09-04]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/release-catchup-2026-09-04
      - run: python3 scripts/temp_doc_finalize.py
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MaintenanceRunbook.md
          git commit -m "docs: finalize pre-release checklist"
          git push origin HEAD:docs/release-catchup-2026-09-04
