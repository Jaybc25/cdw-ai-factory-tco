name: Apply F4 once

on:
  push:
    branches: [fix/f4-deployable-cost-headroom]
    paths:
      - "scripts/apply-f4-deployable-cost-headroom.py"
      - ".github/workflows/apply-f4-once.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/f4-deployable-cost-headroom
      - name: Apply F4 patch
        run: python3 scripts/apply-f4-deployable-cost-headroom.py
      - name: Remove one-shot patch files
        run: git rm scripts/apply-f4-deployable-cost-headroom.py .github/workflows/apply-f4-once.yml
      - name: Commit F4 implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/GpuSizingCalculator.jsx src/gpuSizingRecommendation.js scripts/verifyGpuDeployableRanking.mjs .github/workflows/quality-gate.yml
          git commit -m "F4: rank same-footprint GPU options by headroom and cost"
          git push
