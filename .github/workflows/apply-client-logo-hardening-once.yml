name: Apply client logo hardening once

on:
  push:
    paths:
      - '.github/workflows/apply-client-logo-hardening-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install fixture scan dependency
        run: python3 -m pip install python-pptx
      - name: Apply hardening updates
        run: python3 scripts/harden_client_logo_inputs_once.py
      - name: Run Client Summary regression suite
        run: bash src/run_fixture_suite.sh
      - name: Production build
        run: npm run build
      - name: Commit hardened source and security record
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/SafeImageInput.cjs src/generate_client_summary_full.cjs src/preflight_validate.cjs src/run_fixture_suite.sh CHANGELOG.md MaintenanceRunbook.md
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "security: harden client logo image input"
          git push
