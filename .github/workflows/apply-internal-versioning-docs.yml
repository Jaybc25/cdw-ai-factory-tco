name: Apply internal versioning documentation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-internal-versioning-docs.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply internal versioning policy
        run: python3 scripts/update_internal_versioning_docs_once.py

      - name: Verify documentation diff
        run: |
          git diff --check
          git diff -- README.md AiFactoryProjectBrief.md MaintenanceRunbook.md CHANGELOG.md ReleaseRecordTemplate.md

      - name: Commit documentation policy
        run: |
          git config user.name "ai-factory-docs-bot"
          git config user.email "actions@github.com"
          git add README.md AiFactoryProjectBrief.md MaintenanceRunbook.md CHANGELOG.md ReleaseRecordTemplate.md
          git commit -m "docs: formalize internal suite versioning policy"
          git push
