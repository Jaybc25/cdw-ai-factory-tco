name: Apply shared pricing registry once

on:
  push:
    paths:
      - '.github/workflows/apply-shared-pricing-registry-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply shared pricing imports
        run: python3 scripts/switch_to_shared_pricing_once.py
      - name: Validate shared pricing registry
        run: node scripts/validate_pricing_registry.mjs
      - name: Production build
        run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract TCO workbook snapshot
        run: python3 scripts/extract_tco_workbook_snapshot.py
      - name: Run TCO Excel-to-JavaScript parity
        run: node scripts/run_tco_parity.mjs
      - name: Commit shared pricing migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/TcoCalculator.jsx src/GpuSizingCalculator.jsx
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "refactor: centralize TCO and GPU pricing"
          git push
