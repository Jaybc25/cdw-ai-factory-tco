name: Patch RTX results UX once

on:
  push:
    branches: [fix/rtx-results-ux]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rtx-results-ux
          fetch-depth: 0
      - name: Apply guarded patch
        run: python scripts/patch_rtx_results_ux_once.py
      - name: Commit patched sources and remove one-time runner
        run: |
          rm .github/workflows/patch-rtx-results-ux.yml
          rm scripts/patch_rtx_results_ux_once.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/GpuSizingCalculator.jsx src/inferenceEconomicsThroughput.js .github/workflows/patch-rtx-results-ux.yml scripts/patch_rtx_results_ux_once.py
          git commit -m "Restore compact GPU result hierarchy and RTX sizing handoff"
          git push origin HEAD:fix/rtx-results-ux
