name: Apply Rubin GPU sizing technical support

on:
  push:
    branches:
      - rubin-gpu-sizing-technical

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rubin-gpu-sizing-technical
          fetch-depth: 0
      - name: Apply targeted calculator patch
        run: echo '' | base64 -d | python
      - name: Build
        run: |
          npm ci
          npm run build
      - name: Commit application change and remove helper
        run: |
          rm .github/workflows/apply-rubin-step2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/GpuSizingCalculator.jsx .github/workflows/apply-rubin-step2.yml
          git commit -m "Add gated Rubin GPU sizing technical support"
          git push origin HEAD:rubin-gpu-sizing-technical
