name: RTX PRO TCO policy gate

on:
  pull_request:
    paths:
      - "src/rtxProTcoPolicy.js"
      - "src/rtxProLifecycleTco.js"
      - "src/rtxProServerRegistry.js"
      - "src/rtxProGpuSizing.js"
      - "src/rtxProInferenceEconomicsConnector.js"
      - "src/inferenceEconomicsThroughput.js"
      - "src/InferenceEconomicsGuidedPreview.jsx"
      - "src/RtxProTcoIntake.jsx"
      - "src/RtxProAlternativeCard.jsx"
      - "src/App.jsx"
      - "scripts/validate_rtx_pro_tco_policy.mjs"
      - "scripts/validate_rtx_pro_lifecycle_tco.mjs"
      - "scripts/validate_rtx_pro_tco_handoff_ui.mjs"
      - "scripts/validate_rtx_pro_ie_handoff.mjs"
      - ".github/workflows/rtx-pro-tco-policy.yml"
  push:
    branches: [main]
    paths:
      - "src/rtxProTcoPolicy.js"
      - "src/rtxProLifecycleTco.js"
      - "src/rtxProServerRegistry.js"
      - "src/rtxProGpuSizing.js"
      - "src/rtxProInferenceEconomicsConnector.js"
      - "src/inferenceEconomicsThroughput.js"
      - "src/InferenceEconomicsGuidedPreview.jsx"
      - "src/RtxProTcoIntake.jsx"
      - "src/RtxProAlternativeCard.jsx"
      - "src/App.jsx"
      - "scripts/validate_rtx_pro_tco_policy.mjs"
      - "scripts/validate_rtx_pro_lifecycle_tco.mjs"
      - "scripts/validate_rtx_pro_tco_handoff_ui.mjs"
      - "scripts/validate_rtx_pro_ie_handoff.mjs"
      - ".github/workflows/rtx-pro-tco-policy.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate:
    name: Validate RTX PRO TCO policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate policy guardrails
        run: node scripts/validate_rtx_pro_tco_policy.mjs
      - name: Validate RTX lifecycle TCO math
        run: node scripts/validate_rtx_pro_lifecycle_tco.mjs
      - name: Validate GPU Sizing to TCO handoff UI
        run: node scripts/validate_rtx_pro_tco_handoff_ui.mjs
      - name: Validate RTX TCO to Inference Economics handoff
        run: node scripts/validate_rtx_pro_ie_handoff.mjs
      - name: Production build
        run: npm run build
