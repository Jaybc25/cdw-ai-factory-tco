name: Temporary model-context patch helper

on:
  push:
    branches: [test/model-context-regressions]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/model-context-regressions
      - name: Preserve Custom model identity on TCO handoff
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/TcoCalculator.jsx')
          s = p.read_text()
          old = '    model: model && model.id !== "custom" ? model : null,'
          new = '    model: model || null,'
          if new in s:
              print('Patch already applied')
          elif old in s:
              p.write_text(s.replace(old, new, 1))
              print('Applied Custom model handoff identity patch')
          else:
              raise SystemExit('Expected getInitialModelContext source not found')
          PY
      - name: Commit patch if needed
        run: |
          if git diff --quiet; then
            echo "No source change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/TcoCalculator.jsx
          git commit -m "fix: preserve Custom model identity in TCO handoff"
          git push origin HEAD:test/model-context-regressions
