name: Rubin activation provenance cleanup

on:
  push:
    branches:
      - rubin-tco-customer-activation

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[rubin-provenance-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rubin-tco-customer-activation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Patch stale Rubin audit provenance
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/TcoCalculator.jsx')
          s = p.read_text()
          replacements = [
            (
              'source={"perSysCost" in ov ? "User/client override" : "NVIDIA DGX TCO reference pricing"}',
              'source={"perSysCost" in ov ? "User/client override" : isRubinPhase1 ? "NVIDIA commercial evidence + Phase 1 EST planning assumptions" : "NVIDIA DGX TCO reference pricing"}'
            ),
            (
              'basis={"perSysCost" in ov ? `Default reference: ${fmt(defaults.perSysCost)}, verified ${fmtVerifiedDate(ONPREM_PRICING_VERIFIED_AT)}` : ownSys}',
              'basis={"perSysCost" in ov ? `Default reference: ${fmt(defaults.perSysCost)}, verified ${fmtVerifiedDate(ONPREM_PRICING_VERIFIED_AT)}` : isRubinPhase1 ? `${ownSys}; EST fabric + EST install/PS; optional software NONE; high-density infrastructure QUOTE` : ownSys}'
            ),
            (
              '<AuditSourceRow label="Generational capability factor" value={`${r.genPF.toFixed(2)}×`} source="MLPerf-derived benchmark ratio" confidence="Directional -- workload-dependent" />',
              '<AuditSourceRow label="Generational capability factor" value={`${r.genPF.toFixed(2)}×`} source={isRubinPhase1 ? "Held at 1.00×; qualifying absolute Rubin inference benchmark unavailable" : "MLPerf-derived benchmark ratio"} confidence={isRubinPhase1 ? "Conservative evidence gate" : "Directional -- workload-dependent"} />'
            ),
            (
              '{r.cap.fits && <AuditSourceRow label="Serving capacity estimate" value={`~${r.cap.users.toLocaleString()} users`} source="Rule-of-thumb sizing, not a benchmark" est />}',
              '{r.cap.available !== false && r.cap.fits && <AuditSourceRow label="Serving capacity estimate" value={`~${r.cap.users.toLocaleString()} users`} source="Rule-of-thumb sizing, not a benchmark" est />}'
            ),
            (
              'Cloud rates carry per-cell confidence labels (LISTED / NODE-NORM / EST / QUOTE); on-prem costs are NVIDIA DGX TCO tool captures (Jul–Aug 2026).',
              'Cloud rates carry per-cell confidence labels (LISTED / NODE-NORM / EST / QUOTE); on-prem costs use the active system registry, with Rubin combining current NVIDIA commercial evidence and explicitly labeled Phase 1 EST/PROVISIONAL planning assumptions.'
            ),
          ]
          for old, new in replacements:
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one provenance anchor, found {count}: {old[:80]}')
              s = s.replace(old, new)
          p.write_text(s)
          PY
      - name: Verify and build
        run: |
          npm run verify:rubin
          npm run verify:rubin-tco
          npm run verify:rubin-phase1
          npm run verify:rubin-activation
          npm run build
      - name: Remove temporary workflow and commit only audited file
        run: |
          rm .github/workflows/rubin-activation-provenance-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/TcoCalculator.jsx
          git add -u .github/workflows/rubin-activation-provenance-fix.yml
          git commit -m "Align Rubin TCO audit provenance [rubin-provenance-fixed]"
          git push origin HEAD:rubin-tco-customer-activation
