name: Apply internal versioning docs once

on:
  push:
    paths:
      - '.github/workflows/apply-internal-versioning-docs-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply documentation updates
        run: python3 scripts/update_internal_versioning_docs_once.py
      - name: Commit documentation updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md AiFactoryProjectBrief.md MaintenanceRunbook.md CHANGELOG.md ReleaseRecordTemplate.md
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "docs: formalize internal suite versioning"
          git push
