name: Wire TCO cloud price trend quality gate

on:
  push:
    branches: [tco-cloud-unit-price-trend-production]
    paths:
      - ".github/scripts/wire_tco_cloud_price_trend_gate.py"
      - ".github/workflows/wire-tco-cloud-price-trend-gate.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tco-cloud-unit-price-trend-production
      - name: Wire validator into permanent quality gate
        run: python3 .github/scripts/wire_tco_cloud_price_trend_gate.py
      - name: Commit wiring and clean scaffolding
        run: |
          rm .github/scripts/wire_tco_cloud_price_trend_gate.py
          rm .github/workflows/wire-tco-cloud-price-trend-gate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/quality-gate.yml .github/scripts/wire_tco_cloud_price_trend_gate.py .github/workflows/wire-tco-cloud-price-trend-gate.yml
          git diff --cached --quiet && exit 0
          git commit -m "ci: validate TCO cloud GPU unit-price trend"
          git push