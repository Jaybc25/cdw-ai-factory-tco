name: Temporary cloud pricing disclosure update
on:
  push:
    branches:
      - tco-cloud-pricing-disclosure
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tco-cloud-pricing-disclosure
      - name: Apply source, regression, and changelog updates
        run: python .github/scripts/apply_cloud_pricing_disclosure.py
      - name: Remove temporary helper files
        run: rm .github/scripts/apply_cloud_pricing_disclosure.py .github/workflows/_tmp_cloud_pricing_disclosure.yml
      - name: Commit disclosure update
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Clarify constant cloud unit-price assumption"
          git push origin HEAD:tco-cloud-pricing-disclosure
