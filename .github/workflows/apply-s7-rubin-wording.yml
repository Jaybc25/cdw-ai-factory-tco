name: Apply S7 Rubin training TCO wording

on:
  push:
    branches:
      - fix/s7-rubin-training-tco-wording
    paths:
      - scripts/apply-s7-rubin-wording.py
      - .github/workflows/apply-s7-rubin-wording.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/s7-rubin-training-tco-wording
      - name: Apply S7 patch
        run: python scripts/apply-s7-rubin-wording.py
      - name: Commit S7 changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/apply-s7-rubin-wording.py .github/workflows/apply-s7-rubin-wording.yml
          git add src/GpuSizingCalculator.jsx tests/e2e/rubin-training-tco-wording.spec.js
          git diff --cached --check
          git commit -m "Align Rubin training Phase 1 TCO wording"
          git push origin HEAD:fix/s7-rubin-training-tco-wording
