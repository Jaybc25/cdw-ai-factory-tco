name: GPU Sizing PDF layout experiment

on:
  push:
    branches:
      - experiment/gpu-sizing-pdf-layout
    paths:
      - '.github/workflows/gpu-sizing-pdf-layout-experiment.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-render:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: experiment-only-placeholder
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/gpu-sizing-pdf-layout
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply branch-only GPU Sizing PDF layout changes
        run: python3 scripts/apply_gpu_pdf_layout_experiment.py
      - name: Validate shared pricing registry
        run: node scripts/validate_pricing_registry.mjs
      - name: Production build
        run: npm run build
      - name: Install Playwright
        run: npm install --no-save --no-package-lock @playwright/test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start local preview
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/gpu-preview.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/gpu-sizing >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/gpu-preview.log
          exit 1
      - name: Render default-scenario GPU Sizing experiment PDF
        run: node scripts/render_gpu_report_experiment.mjs artifacts/gpu-sizing-report-experiment.pdf
      - name: Upload comparison artifact
        uses: actions/upload-artifact@v4
        with:
          name: gpu-sizing-report-layout-experiment
          path: artifacts/gpu-sizing-report-experiment.pdf
          if-no-files-found: error
          retention-days: 14
      - name: Commit branch-only layout changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/GpuSizingCalculator.jsx
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "experiment: improve GPU Sizing PDF layout"
          git push origin HEAD:experiment/gpu-sizing-pdf-layout

# Rerun after renderer selector disambiguation.
