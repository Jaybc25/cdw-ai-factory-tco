name: Readiness PDF layout experiment

on:
  push:
    branches: [experiment/readiness-pdf-layout]
    paths: ['.github/workflows/readiness-pdf-layout-experiment.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-render:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: experiment-only-placeholder
    steps:
      - uses: actions/checkout@v4
        with: { ref: experiment/readiness-pdf-layout }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - run: python3 scripts/apply_readiness_pdf_layout_experiment.py
      - run: npm run build
      - run: npm install --no-save --no-package-lock @playwright/test
      - run: npx playwright install --with-deps chromium
      - run: |
          npm run preview -- --host 127.0.0.1 > /tmp/preview.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/readiness >/dev/null && exit 0; sleep 1; done
          cat /tmp/preview.log; exit 1
      - run: node scripts/render_readiness_report_experiment.mjs artifacts/readiness-report-experiment.pdf
      - uses: actions/upload-artifact@v4
        with:
          name: readiness-report-layout-experiment
          path: artifacts/readiness-report-experiment.pdf
          if-no-files-found: error
          retention-days: 14
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/AiReadinessChecklists.jsx
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "experiment: improve Readiness PDF layout"
          git push origin HEAD:experiment/readiness-pdf-layout
