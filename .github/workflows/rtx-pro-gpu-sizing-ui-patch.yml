name: Apply guarded RTX PRO GPU Sizing UI patch

on:
  push:
    branches:
      - feature/rtx-pro-gpu-sizing-ui
    paths:
      - ".github/workflows/rtx-pro-gpu-sizing-ui-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rtx-pro-gpu-sizing-ui
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply exact guarded integration patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("src/GpuSizingCalculator.jsx")
          text = p.read_text()

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              text = text.replace(old, new, 1)

          replace_once(
              'import { classifyInferenceScaleout } from "./inferenceScaleoutClassification.js";\n',
              'import { classifyInferenceScaleout } from "./inferenceScaleoutClassification.js";\nimport { sizeRtxProInference } from "./rtxProGpuSizing.js";\nimport RtxProAlternativeCard from "./RtxProAlternativeCard.jsx";\n',
              "RTX imports",
          )

          replace_once(
              '  environment: "Whether this is a real production deployment or something lighter-weight. Dev/Test/POC unlocks a note about cheaper workstation-class GPUs, since production reliability requirements don\'t apply yet.",',
              '  environment: "Whether this is a real production deployment or something lighter-weight. RTX PRO production alternatives are evaluated separately through evidence-gated server sizing; this field does not relax production hardware requirements.",',
              "environment tooltip",
          )

          old_rtx = '''const RTX_SPEC = {\n  id: "RTX PRO 6000 Blackwell",\n  vram: 96,\n  anchor: 2095,\n  anchorPrecision: "FP8",\n  source: "EST, derived from memory-bandwidth ratio vs H100 -- no MLPerf datacenter submission exists for workstation-class GPUs; community vLLM benchmarks (CloudRift, Oct 2025) confirm the same bandwidth-bound scaling pattern on smaller models",\n  maxWorkstationGPUs: 4,\n  price: { amount: 8500, confidence: "LISTED", source: "StorageReview.com RTX PRO 6000 Workstation review, listed retail price" },\n};\n\nfunction ceilDiv(a, b) {\n  return Math.ceil(a / b);\n}\n\n'''
          replace_once(old_rtx, '', "legacy workstation RTX constant")

          old_compute = '''  const rtxEffectiveAnchor = RTX_SPEC.anchor * throughputScale.factor;\n  const rtxGpusMem = ceilDiv(totalMemoryGB, RTX_SPEC.vram);\n  const rtxGpusPerf = ceilDiv(totalThroughputNeeded, rtxEffectiveAnchor);\n  const rtxWorkload = Math.max(rtxGpusMem, rtxGpusPerf);\n  const rtxEligible = inputs.environment === "Dev/Test/POC" && rtxWorkload <= RTX_SPEC.maxWorkstationGPUs;\n  const rtxAlt = {\n    eligible: rtxEligible,\n    class: RTX_SPEC.id,\n    gpus: rtxWorkload,\n    vram: RTX_SPEC.vram,\n    overCap: rtxWorkload > RTX_SPEC.maxWorkstationGPUs,\n  };\n'''
          new_compute = '''  const rtxAlt = sizeRtxProInference({\n    modelId: model.id,\n    precision: inputs.quant,\n    totalMemoryGB,\n    aggregateTokensPerSecond: totalThroughputNeeded,\n    avgInputTokens: inputs.avgInputTokens,\n    avgOutputTokens: inputs.avgOutputTokens,\n  });\n'''
          replace_once(old_compute, new_compute, "RTX sizing call")

          report_start = '            {mode === "Inference" && environment === "Dev/Test/POC" && result.rtxAlt.eligible && ('
          report_end = '            <div className="text-xs font-bold uppercase tracking-wide text-gray-500 mb-2">Caveats &amp; methodology</div>'
          if text.count(report_start) != 1 or text.count(report_end) != 1:
              raise SystemExit("report RTX block guard failed")
          a = text.index(report_start)
          b = text.index(report_end, a)
          text = text[:a] + '            {mode === "Inference" && <RtxProAlternativeCard rtxAlt={result.rtxAlt} />}\n' + text[b:]

          calc_start = '              {mode === "Inference" && environment === "Dev/Test/POC" && <div className="mb-4">'
          calc_end = '              <div className="text-xs text-gray-500 p-3 bg-gray-50 rounded-lg mb-4"><strong>Sizing method:</strong>'
          if text.count(calc_start) != 1 or text.count(calc_end) != 1:
              raise SystemExit("calculator RTX block guard failed")
          a = text.index(calc_start)
          b = text.index(calc_end, a)
          text = text[:a] + '              {mode === "Inference" && <RtxProAlternativeCard rtxAlt={result.rtxAlt} />}\n' + text[b:]

          p.write_text(text)

          v = Path("scripts/validate_pricing_registry.mjs")
          validation = v.read_text()
          marker = 'if (errors.length) {\n'
          if validation.count(marker) != 1:
              raise SystemExit("pricing validation insertion guard failed")
          checks = '''// GPU Sizing UI must consume the evidence-gated RTX server engine and must\n// not retain the former Dev/Test workstation estimate in parallel.\nif (!sizingSource.includes('import { sizeRtxProInference } from "./rtxProGpuSizing.js";')) {\n  errors.push("GPU Sizing must import the evidence-gated RTX PRO sizing engine");\n}\nif (!sizingSource.includes('<RtxProAlternativeCard rtxAlt={result.rtxAlt} />')) {\n  errors.push("GPU Sizing must render the RTX PRO server alternative from the evidence-gated result");\n}\nif (sizingSource.includes("const RTX_SPEC") || sizingSource.includes("maxWorkstationGPUs") || sizingSource.includes("Workstation alternative")) {\n  errors.push("Legacy workstation-class RTX sizing must not coexist with the production RTX PRO server path");\n}\nif (sizingSource.includes('inputs.environment === "Dev/Test/POC" && rtxWorkload')) {\n  errors.push("RTX PRO server eligibility must not be gated by the legacy Dev/Test workstation condition");\n}\n\n'''
          validation = validation.replace(marker, checks + marker, 1)
          v.write_text(validation)
          PY

      - name: Remove one-time patch workflow from branch
        run: rm .github/workflows/rtx-pro-gpu-sizing-ui-patch.yml

      - name: Commit guarded patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/GpuSizingCalculator.jsx src/RtxProAlternativeCard.jsx scripts/validate_pricing_registry.mjs .github/workflows/rtx-pro-gpu-sizing-ui-patch.yml
          git commit -m "Wire evidence-gated RTX PRO server sizing into GPU Sizing UI"
          git push origin HEAD:feature/rtx-pro-gpu-sizing-ui
