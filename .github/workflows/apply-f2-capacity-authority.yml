name: Apply F2 capacity authority patch
on:
  push:
    branches:
      - fix/f2-capacity-authority
    paths:
      - .github/workflows/apply-f2-capacity-authority.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/f2-capacity-authority
      - name: Apply F2 patch
        run: python scripts/apply-f2-capacity-authority.py
      - name: Commit F2 changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm scripts/apply-f2-capacity-authority.py .github/workflows/apply-f2-capacity-authority.yml
          git add src/GpuSizingCalculator.jsx src/TcoCalculator.jsx tests/e2e/tco-workload-capacity-authority.spec.js
          git commit -m "Fix F2 workload capacity authority"
          git push origin HEAD:fix/f2-capacity-authority
