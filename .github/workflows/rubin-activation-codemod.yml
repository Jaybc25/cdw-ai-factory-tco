name: Rubin activation codemod

on:
  push:
    branches:
      - rubin-tco-customer-activation

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[rubin-activation-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rubin-tco-customer-activation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Refresh one stale guarded anchor
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/applyRubinTcoActivation.mjs')
          s = p.read_text()
          old = 'on-prem defaults = NVIDIA DGX TCO tool (Jul 2026). Edits stick until reset, including across provider switches.'
          new = 'on-prem defaults = NVIDIA DGX TCO tool ({ONPREM_ASOF}). Cloud instance-rate edits are saved by provider + GPU class, and system-specific on-prem edits are saved by target system, so workload changes do not erase customer-entered pricing or misapply it to different hardware.'
          if s.count(old) != 1:
              raise SystemExit(f'Expected exactly one stale rate-card anchor, found {s.count(old)}')
          p.write_text(s.replace(old, new))
          PY
      - name: Apply guarded source edits
        run: node scripts/applyRubinTcoActivation.mjs
      - name: Fix Rubin disclosure JSX grouping
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/TcoCalculator.jsx')
          s = p.read_text()
          before = '''          ) : (\n            <Seg options={OWN_TARGETS} value={ownSys} onChange={setOwnSys} />\n          {isRubinPhase1 && ('''
          after = '''          ) : (\n            <Seg options={OWN_TARGETS} value={ownSys} onChange={setOwnSys} />\n          )}\n          {isRubinPhase1 && ('''
          if s.count(before) != 1:
              raise SystemExit(f'Expected one Rubin selector grouping anchor, found {s.count(before)}')
          s = s.replace(before, after)
          before2 = '''          )}\n          )}\n          <Slider label="Workload mix — training share"'''
          after2 = '''          )}\n          <Slider label="Workload mix — training share"'''
          if s.count(before2) != 1:
              raise SystemExit(f'Expected one extra ternary close after Rubin disclosure, found {s.count(before2)}')
          p.write_text(s.replace(before2, after2))
          PY
      - name: Verify Rubin evidence and activation
        run: |
          npm run verify:rubin
          npm run verify:rubin-tco
          npm run verify:rubin-phase1
          npm run verify:rubin-activation
          npm run build
      - name: Remove one-time activation machinery
        run: |
          rm scripts/applyRubinTcoActivation.mjs
          rm .github/workflows/rubin-activation-codemod.yml
          rm scripts/.rubin-activation-trigger
      - name: Commit only audited activation files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/TcoCalculator.jsx src/GpuSizingCalculator.jsx src/pricingRegistry.js
          git add -u scripts/applyRubinTcoActivation.mjs .github/workflows/rubin-activation-codemod.yml scripts/.rubin-activation-trigger
          git diff --cached --name-only
          git commit -m "Wire Rubin into customer-facing Phase 1 TCO [rubin-activation-applied]"
          git push origin HEAD:rubin-tco-customer-activation
