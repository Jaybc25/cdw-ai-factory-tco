name: Rubin inference advisory codemod

on:
  push:
    branches:
      - rubin-inference-advisory

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rubin-inference-advisory
          fetch-depth: 0
      - name: Apply guarded source updates
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/GpuSizingCalculator.jsx')
          s = p.read_text()

          def replace_once(text, old, new, label):
            if text.count(old) != 1:
              raise SystemExit(f'{label} guard failed: found {text.count(old)} matches')
            return text.replace(old, new, 1)

          old = 'import { selectDeployableRecommendation } from "./gpuSizingRecommendation.js";\n'
          new = old + 'import { getRubinInferenceAdvisory } from "./rubinInferenceAdvisory.js";\n'
          s = replace_once(s, old, new, 'import')

          old = '  const idleGpuHoursAfterHours = recommendedCount * afterHours;\n  const headroomGpuHoursDuringDay = recommendedCount * (1 - utilization.recommended) * workingDayHours;\n\n  return {'
          new = '  const idleGpuHoursAfterHours = recommendedCount * afterHours;\n  const headroomGpuHoursDuringDay = recommendedCount * (1 - utilization.recommended) * workingDayHours;\n  const rubinAdvisory = getRubinInferenceAdvisory({\n    recommended: recommendedCount,\n    selectedClass: selected.id,\n    totalThroughputNeeded,\n  });\n\n  return {'
          s = replace_once(s, old, new, 'result prep')

          s = replace_once(s, '    utilization,\n    workingDayHours,', '    utilization,\n    rubinAdvisory,\n    workingDayHours,', 'result object')

          old = '                      <strong>Rubin inference:</strong> {RUBIN_INFERENCE_NAMES} are intentionally not selectable yet. NVIDIA has not published a qualifying absolute per-GPU inference-throughput result comparable to the tool\'s current anchors. Training sizing is available; no FLOPS-, ratio-, or tokens/MW-derived inference estimate is used.'
          new = '                      <strong>Rubin exact sizing:</strong> {RUBIN_INFERENCE_NAMES} are not selectable for benchmark-qualified GPU counts yet because a qualifying absolute per-GPU inference-throughput anchor is still unavailable. For rack-scale Blackwell results, the tool now surfaces Rubin separately as a provisional architecture-evaluation advisory without inventing a Rubin GPU count.'
          s = replace_once(s, old, new, 'warning')

          old = '              <BudgetPanel budget={selectedBudget ? { recommended: selectedBudget } : null} />\n              {mode === "Training" && isRubinClass(result.selectedClass) && ('
          new = '''              <BudgetPanel budget={selectedBudget ? { recommended: selectedBudget } : null} />
              {mode === "Inference" && result.rubinAdvisory && (
                <div className="mb-4 rounded-xl p-4 border border-amber-300 bg-amber-50">
                  <div className="flex items-center justify-between gap-3 mb-1">
                    <div className="text-xs font-bold uppercase tracking-wide text-amber-900">Rubin architecture evaluation recommended</div>
                    <span className="text-[10px] font-bold px-2 py-0.5 rounded bg-amber-200 text-amber-900">PROVISIONAL</span>
                  </div>
                  <div className="text-sm font-semibold text-amber-950 mb-1">Verified sizing baseline: {result.recommended.toLocaleString()} × {result.selectedClass}</div>
                  <p className="text-xs text-amber-900 mb-1">This benchmark-qualified Blackwell result has reached rack-scale deployment. Evaluate DGX Rubin NVL8 and DGX Vera Rubin NVL72 with CDW/NVIDIA solution engineering before committing to a large Blackwell build.</p>
                  <p className="text-xs text-amber-800"><strong>No exact Rubin GPU count is shown.</strong> Rubin inference efficiency evidence is strong, but the absolute per-GPU throughput anchor required by this calculator is still unavailable; FLOPS, relative ratios, and tokens/MW are not converted into synthetic sizing.</p>
                </div>
              )}
              {mode === "Training" && isRubinClass(result.selectedClass) && ('''
          s = replace_once(s, old, new, 'calculator advisory insertion')

          old = '          <BudgetPanel budget={result.budget} />\n          {mode === "Training" && isRubinClass(result.selectedClass) && ('
          new = '''          <BudgetPanel budget={result.budget} />
          {mode === "Inference" && result.rubinAdvisory && (
            <div className="mb-6 rounded-xl p-4 border border-amber-300 bg-amber-50 text-xs text-amber-900">
              <div className="font-bold uppercase tracking-wide mb-1">Rubin architecture evaluation recommended · PROVISIONAL</div>
              <div className="font-semibold mb-1">Verified sizing baseline: {result.recommended.toLocaleString()} × {result.selectedClass}</div>
              <div>At this rack-scale Blackwell footprint, evaluate DGX Rubin NVL8 and DGX Vera Rubin NVL72 with CDW/NVIDIA solution engineering. No exact Rubin GPU count, utilization, or cost-per-token is inferred because a qualifying absolute per-GPU inference-throughput anchor is still unavailable.</div>
            </div>
          )}
          {mode === "Training" && isRubinClass(result.selectedClass) && ('''
          s = replace_once(s, old, new, 'report advisory insertion')

          p.write_text(s)

          pkg = Path('package.json')
          t = pkg.read_text()
          old = '    "verify:blackwell-inference": "node scripts/verifyBlackwellInferenceAnchors.mjs"\n'
          new = '    "verify:blackwell-inference": "node scripts/verifyBlackwellInferenceAnchors.mjs",\n    "verify:rubin-inference-advisory": "node scripts/verifyRubinInferenceAdvisory.mjs"\n'
          t = replace_once(t, old, new, 'package')
          pkg.write_text(t)
          PY
      - name: Validate advisory
        run: |
          npm ci
          npm run verify:rubin-inference-advisory
          npm run verify:blackwell-inference
          npm run verify:rubin
          npm run build
      - name: Commit durable changes and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/GpuSizingCalculator.jsx package.json
          git rm .github/workflows/rubin-inference-advisory-codemod.yml
          git commit -m "Surface Rubin for rack-scale inference evaluation"
          git push origin HEAD:rubin-inference-advisory
