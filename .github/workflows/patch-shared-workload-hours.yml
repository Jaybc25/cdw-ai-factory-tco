name: Apply shared workload hours patch

on:
  push:
    branches:
      - feature/shared-workload-hours
    paths:
      - scripts/apply-shared-workload-hours.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/shared-workload-hours

      - name: Apply patch
        run: python scripts/apply-shared-workload-hours.py

      - name: Commit production change and regression
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/apply-shared-workload-hours.py .github/workflows/patch-shared-workload-hours.yml
          git add src/TcoCalculator.jsx tests/e2e/tco-working-day-sync.spec.js
          git diff --cached --check
          git commit -m "Add shared workload-hours sensitivity"
          git push origin HEAD:feature/shared-workload-hours
