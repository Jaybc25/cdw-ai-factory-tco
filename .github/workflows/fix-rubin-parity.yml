name: Fix Rubin parity harness

on:
  push:
    branches:
      - rubin-tco-customer-activation

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[rubin-parity-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rubin-tco-customer-activation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Patch parity VM dependency
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/run_tco_parity.mjs')
          s = p.read_text()
          old_import = 'import { trendCloudGpuCompute } from "../src/cloudUnitPriceTrend.js";'
          new_import = old_import + '\nimport { isRubinPhase1TcoSystem } from "../src/rubinTcoActivationRegistry.js";'
          if s.count(old_import) != 1:
              raise SystemExit(f'Expected one cloud trend import anchor, found {s.count(old_import)}')
          s = s.replace(old_import, new_import)
          old_sandbox = '  trendCloudGpuCompute,\n  __fixture: fixture,'
          new_sandbox = '  trendCloudGpuCompute,\n  isRubinPhase1TcoSystem,\n  __fixture: fixture,'
          if s.count(old_sandbox) != 1:
              raise SystemExit(f'Expected one parity sandbox anchor, found {s.count(old_sandbox)}')
          s = s.replace(old_sandbox, new_sandbox)
          p.write_text(s)
          PY
      - name: Verify parity and build
        run: |
          node scripts/run_tco_parity.mjs
          npm run verify:rubin
          npm run verify:rubin-tco
          npm run verify:rubin-phase1
          npm run verify:rubin-activation
          npm run build
      - name: Remove temporary workflow and commit fix
        run: |
          rm .github/workflows/fix-rubin-parity.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/run_tco_parity.mjs
          git rm --cached .github/workflows/fix-rubin-parity.yml || true
          git commit -m "Fix Rubin dependency in TCO parity VM [rubin-parity-fixed]"
          git push origin HEAD:rubin-tco-customer-activation
