name: Update assurance status docs

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-assurance-docs.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update durable assurance records
        run: python3 scripts/update_assurance_docs_once.py

      - name: Verify documentation diff
        run: git diff --check && git diff -- CHANGELOG.md MaintenanceRunbook.md AiFactoryProjectBrief.md

      - name: Commit durable status update
        run: |
          git config user.name "ai-factory-quality-bot"
          git config user.email "actions@github.com"
          git add CHANGELOG.md MaintenanceRunbook.md AiFactoryProjectBrief.md
          git commit -m "docs: record automated assurance baseline"
          git push
