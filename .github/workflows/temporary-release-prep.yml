name: Temporary release prep

on:
  push:
    branches:
      - release/2026.09.1-prep

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/2026.09.1-prep

      - name: Finalize release changelog
        run: |
          python3 -c "from pathlib import Path; p=Path('CHANGELOG.md'); t=p.read_text(); t=t.replace('## Unreleased\n\n\n### September 4, 2026 - Report, model-context, handoff, and security hardening\n','## Unreleased\n\n- No unreleased changes yet.\n\n## AI Factory Suite 2026.09.1 - 2026-09-04\n\n### September 4, 2026 - Report, model-context, handoff, and security hardening\n',1); anchor='#### Current assurance and release-preparation state\n'; add='#### Pre-release cross-tool state-precedence pass - PR 13\n\n- Added permanent cross-tool browser journeys for Use Case Explorer to Model Advisor, Use Case Explorer to GPU Sizing, Model Advisor to GPU Sizing, and TCO to ROI state ownership and precedence.\n- The pass found and corrected a real Model Advisor to GPU Sizing defect in Training mode and stale provenance handling.\n- PR 13 merged as 2222fcd2a5ca6b437b7b46c63fda3ffa21a16020; the exact merged tree passed build/parity and live Vercel checks and deployed successfully before release preparation.\n\n'; t=t if 'Pre-release cross-tool state-precedence pass - PR 13' in t else t.replace(anchor,add+anchor,1); t=t.replace('- The next same-month stable candidate is `v2026.09.1`; when cut, `package.json` should move from legacy `2.8.0` to SemVer-safe `2026.9.1`.','- This release transitions package metadata from legacy 2.8.0 to SemVer-safe 2026.9.1, matching human suite release 2026.09.1 and tag v2026.09.1.',1); p.write_text(t)"

      - name: Remove helper and commit
        run: |
          rm .github/workflows/temporary-release-prep.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add CHANGELOG.md .github/workflows/temporary-release-prep.yml
          git commit -m "release: finalize AI Factory Suite 2026.09.1 changelog"
          git push origin HEAD:release/2026.09.1-prep
