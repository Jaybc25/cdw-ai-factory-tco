name: Temporary release prep

on:
  push:
    branches:
      - release/2026.09.1-prep

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/2026.09.1-prep

      - name: Finalize release changelog
        run: node -e "const fs=require('fs');let t=fs.readFileSync('CHANGELOG.md','utf8');const a='## Unreleased\\n\\n\\n### September 4, 2026 - Report, model-context, handoff, and security hardening\\n';const b='## Unreleased\\n\\n- No unreleased changes yet.\\n\\n## AI Factory Suite 2026.09.1 - 2026-09-04\\n\\n### September 4, 2026 - Report, model-context, handoff, and security hardening\\n';if(t.includes(a))t=t.replace(a,b);if(!t.includes('#### Pre-release cross-tool state-precedence pass - PR #13'))t=t.replace('#### Current assurance and release-preparation state\\n','#### Pre-release cross-tool state-precedence pass - PR #13\\n\\n- Added permanent cross-tool browser journeys for Use Case Explorer -> Model Advisor, Use Case Explorer -> GPU Sizing, Model Advisor -> GPU Sizing, and TCO -> ROI state ownership and precedence.\\n- The pass found and corrected a real Model Advisor -> GPU Sizing defect in Training mode and stale provenance handling.\\n- PR #13 merged as `2222fcd2a5ca6b437b7b46c63fda3ffa21a16020`; the exact merged tree passed build/parity and live Vercel checks and deployed successfully before release preparation.\\n\\n#### Current assurance and release-preparation state\\n');t=t.replace('- The next same-month stable candidate is `v2026.09.1`; when cut, `package.json` should move from legacy `2.8.0` to SemVer-safe `2026.9.1`.','- This release transitions package metadata from legacy `2.8.0` to SemVer-safe `2026.9.1`, matching human suite release `2026.09.1` / tag `v2026.09.1`.');fs.writeFileSync('CHANGELOG.md',t);"

      - name: Remove helper and commit
        run: |
          rm .github/workflows/temporary-release-prep.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add CHANGELOG.md .github/workflows/temporary-release-prep.yml
          git commit -m "release: finalize AI Factory Suite 2026.09.1 changelog"
          git push origin HEAD:release/2026.09.1-prep
