name: Temporary release prep

on:
  push:
    branches:
      - release/2026.09.1-prep

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/2026.09.1-prep

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Update package metadata
        run: npm version 2026.9.1 --no-git-tag-version

      - name: Commit package metadata
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json package-lock.json
          git commit -m "release: align package metadata to 2026.9.1"
          git push origin HEAD:release/2026.09.1-prep
