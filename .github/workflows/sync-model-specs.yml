name: Sync model specs (Hugging Face)

on:
  schedule:
    - cron: "0 6 1 * *"   # 06:00 UTC on the 1st of each month
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests
      - name: Run sync
        run: python3 sync_model_specs.py
      - name: Commit updated snapshot
        run: |
          git config user.name "model-advisor-bot"
          git config user.email "actions@github.com"
          git add data/model_specs.json
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: sync model_specs.json ($(date -u +%Y-%m-%d))"
          git push
