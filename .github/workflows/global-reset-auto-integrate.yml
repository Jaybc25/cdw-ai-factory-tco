name: Global Reset branch integrator

on:
  push:
    branches: [feature/global-reset-v1]
    paths:
      - "scripts/apply_global_reset_readiness_integration.mjs"
      - ".github/workflows/global-reset-auto-integrate.yml"

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message, '[global-reset-auto]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/global-reset-v1
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Apply targeted Readiness integration patch
        run: node scripts/apply_global_reset_readiness_integration.mjs

      - name: Install dependencies
        run: npm ci

      - name: Production build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: branch-reset-placeholder
        run: npm run build

      - name: Commit integrated Readiness source only if changed
        run: |
          if git diff --quiet -- src/AiReadinessChecklists.jsx; then
            echo "AiReadinessChecklists.jsx already integrated"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/AiReadinessChecklists.jsx
          git commit -m "Integrate Readiness with Global Reset [global-reset-auto]"
          git push origin HEAD:feature/global-reset-v1
