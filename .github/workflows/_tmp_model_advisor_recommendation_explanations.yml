name: Temporary Model Advisor recommendation explanation patch

on:
  push:
    branches: [model-advisor-recommendation-explanations]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: model-advisor-recommendation-explanations
      - name: Apply patch
        run: python3 .github/scripts/apply_model_advisor_recommendation_explanations.py
      - name: Remove temporary helper
        run: rm .github/scripts/apply_model_advisor_recommendation_explanations.py .github/workflows/_tmp_model_advisor_recommendation_explanations.yml
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: expand Model Advisor recommendation explanations"
          git push origin HEAD:model-advisor-recommendation-explanations
