name: Managed API catalog shadow watch

on:
  workflow_dispatch: {}
  schedule:
    - cron: "30 10 * * *"

permissions:
  contents: read
  issues: write

concurrency:
  group: managed-api-catalog-watch
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Collect catalog candidates
        env:
          MANAGED_CATALOG_REPORT_PATH: managed-api-catalog-review.md
          MANAGED_CATALOG_JSON_PATH: managed-api-catalog-review.json
        run: node scripts/managedApiCatalogWatch.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: managed-api-catalog-review
          path: |
            managed-api-catalog-review.md
            managed-api-catalog-review.json
      - name: Keep catalog review issue current
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const title = 'AI Factory: managed API catalog review';
            const body = fs.readFileSync('managed-api-catalog-review.md', 'utf8');
            const observation = JSON.parse(fs.readFileSync('managed-api-catalog-review.json', 'utf8'));
            const { owner, repo } = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', per_page: 100,
            });
            const issue = issues.find(item => !item.pull_request && item.title === title);
            let issueNumber;
            if (issue) {
              issueNumber = issue.number;
              if (issue.body !== body) {
                await github.rest.issues.update({ owner, repo, issue_number: issueNumber, body });
              }
            } else {
              const created = await github.rest.issues.create({ owner, repo, title, body });
              issueNumber = created.data.number;
            }
            // Comment when the signal changes. Stable daily checks update the
            // issue body and artifacts, without a new comment each morning.
            const signal = {
              states: observation.rows.map(row => [row.provider, row.modelId, row.state,
                row.crosscheckState, row.modelsDev?.input, row.modelsDev?.output]),
              discoveries: observation.discoveries.map(row => [row.provider, row.modelId]),
              sourceErrors: observation.sourceErrors.map(error => error.split(':')[0]),
            };
            const hash = crypto.createHash('sha256').update(JSON.stringify(signal)).digest('hex').slice(0, 16);
            const marker = `<!-- managed-api-catalog-signal:${hash} -->`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: issueNumber, per_page: 100,
            });
            const last = comments.filter(item => item.body?.includes('<!-- managed-api-catalog-signal:')).at(-1);
            if (!last?.body?.includes(marker)) {
              const changed = observation.rows.filter(row => row.state !== 'MATCHED' ||
                !['MATCHED', 'NO_MATCH'].includes(row.crosscheckState));
              const summary = [`Catalog shadow check ${observation.observedAt.slice(0, 10)}: ` +
                `${observation.rows.length} tracked models, ${changed.length} review signals, ` +
                `${observation.discoveries.length} recent model candidates.`,
                ...changed.slice(0, 20).map(row => `- ${row.provider} / ${row.modelId}: ${row.state}, cross-check ${row.crosscheckState}`),
                `[Details in the issue body and workflow artifact](${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}). ` +
                'No production pricing or model selection changed.'];
              await github.rest.issues.createComment({ owner, repo, issue_number: issueNumber,
                body: `${marker}\n${summary.join('\n')}` });
            }
