name: Record shared pricing registry once

on:
  push:
    paths:
      - '.github/workflows/record-shared-pricing-registry-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update durable project documentation
        run: python3 scripts/record_shared_pricing_registry_once.py
      - name: Commit documentation update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md CHANGELOG.md MaintenanceRunbook.md AiFactoryProjectBrief.md
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "docs: record shared pricing registry architecture"
          git push
