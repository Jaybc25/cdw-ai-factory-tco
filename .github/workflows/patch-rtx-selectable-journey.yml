name: Apply RTX selectable journey patch

on:
  push:
    branches:
      - feature/rtx-selectable-journey

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rtx-selectable-journey
      - name: Apply exact guarded replacements
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/GpuSizingCalculator.jsx')
          text = path.read_text()

          old_calc = '<div className="flex flex-wrap gap-3 mb-4"><ResultCard icon={Cpu} title="Unrounded requirement" gpuClass={result.selectedClass} gpus={result.minTechnical} subtitle="Technical workload requirement before production-system rounding" /><ResultCard icon={Zap} title="Recommended" gpuClass={result.selectedClass} gpus={result.recommended} subtitle="Node-rounded for production" accent selectable={Boolean(TCO_OWN_SYS_FOR_CLASS[result.selectedClass])} selected={effectiveTcoSelection === "recommended"} onSelect={() => setTcoSelection("recommended")} /></div>'
          new_calc = '<div className="flex flex-wrap gap-3 mb-4"><ResultCard icon={Zap} title="Recommended" gpuClass={result.selectedClass} gpus={result.recommended} subtitle="Node-rounded, sourceable production configuration" accent selectable={Boolean(TCO_OWN_SYS_FOR_CLASS[result.selectedClass])} selected={effectiveTcoSelection === "recommended"} onSelect={() => setTcoSelection("recommended")} /></div>'
          if text.count(old_calc) != 1:
              raise SystemExit(f'Expected exactly one calculator unrounded card block, found {text.count(old_calc)}')
          text = text.replace(old_calc, new_calc)

          old_report = '          <div className="flex flex-wrap gap-3 mb-6">\n            <ResultCard icon={Cpu} title="Unrounded requirement" gpuClass={result.selectedClass} gpus={result.minTechnical} subtitle="Technical workload requirement before production-system rounding" />\n            <ResultCard'
          new_report = '          <div className="flex flex-wrap gap-3 mb-6">\n            <ResultCard'
          if text.count(old_report) != 1:
              raise SystemExit(f'Expected exactly one report unrounded card block, found {text.count(old_report)}')
          text = text.replace(old_report, new_report)

          path.write_text(text)

          test_path = Path('tests/e2e/gpu-sizing-architecture-aware.spec.js')
          test_text = test_path.read_text()
          old_count = test_text.count('resultCard(page, "Unrounded requirement")')
          if old_count < 1:
              raise SystemExit('Expected existing Unrounded requirement browser assertions')
          test_text = '\n'.join(
              line for line in test_text.splitlines()
              if 'resultCard(page, "Unrounded requirement")' not in line
          ) + '\n'
          absence_test = '''\n\ntest("unrounded technical requirement is audit-only, not a customer-facing option", async ({ page }) => {\n  await page.goto("/gpu-sizing", { waitUntil: "domcontentloaded" });\n  await expect(page.getByText("Unrounded requirement", { exact: true })).toHaveCount(0);\n  await expect(resultCard(page, "Recommended")).toBeVisible();\n});\n'''
          test_text += absence_test
          test_path.write_text(test_text)

          Path('.github/workflows/patch-rtx-selectable-journey.yml').unlink()
          PY
      - name: Commit guarded patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/GpuSizingCalculator.jsx tests/e2e/gpu-sizing-architecture-aware.spec.js .github/workflows/patch-rtx-selectable-journey.yml
          git commit -m "Remove unsourceable unrounded GPU option from customer view"
          git push origin HEAD:feature/rtx-selectable-journey
