name: Temporary growth selection patch
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpu-sizing-growth-selection
      - name: Apply patch
        shell: bash
        run: python .github/scripts/apply_growth_selection_patch.py
      - name: Commit patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/GpuSizingCalculator.jsx src/TcoCalculator.jsx tests/e2e/tco-handoff-ownership.spec.js docs/MODEL_MODERNIZATION_CURRENT_STATE.md CHANGELOG.md
          git commit -m "Add selectable higher-growth TCO handoff"
          git push origin HEAD:gpu-sizing-growth-selection
