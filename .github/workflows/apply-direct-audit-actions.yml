name: Apply direct audit actions

on:
  push:
    branches:
      - ux-direct-audit-actions

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux-direct-audit-actions
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply focused UX patch
        run: node scripts/apply-direct-audit-actions.mjs
      - name: Remove temporary patch machinery
        run: rm -f scripts/apply-direct-audit-actions.mjs .github/workflows/apply-direct-audit-actions.yml
      - name: Commit patched components
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/GpuSizingCalculator.jsx src/ModelAdvisor.jsx src/RoiCalculator.jsx src/TcoCalculator.jsx scripts/apply-direct-audit-actions.mjs .github/workflows/apply-direct-audit-actions.yml
          git commit -m "Expose audit trails beside report actions"
          git push origin ux-direct-audit-actions
