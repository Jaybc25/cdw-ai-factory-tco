name: Sync capability scores (Artificial Analysis)

on:
  schedule:
    - cron: "0 6 * * 1"   # 06:00 UTC every Monday
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests
      - name: Run sync
        env:
          AA_API_KEY: ${{ secrets.AA_API_KEY }}
        run: python3 sync_capability_scores.py
      - name: Commit updated snapshot and discovery log
        run: |
          git config user.name "model-advisor-bot"
          git config user.email "actions@github.com"
          git add data/model_capability_db.json data/aa_discovery_candidates.json
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: sync model_capability_db.json ($(date -u +%Y-%m-%d))"
          git push
