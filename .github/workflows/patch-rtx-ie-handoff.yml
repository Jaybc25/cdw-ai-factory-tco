name: Apply guarded RTX IE handoff patch

on:
  push:
    branches: [feature/rtx-pro-ie-handoff]
    paths:
      - ".github/workflows/patch-rtx-ie-handoff.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rtx-pro-ie-handoff
      - name: Apply exact-string guarded patches
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          # Guided IE: admit RTX as its own hardware class and carry exact benchmark id.
          replace_once(
              "src/InferenceEconomicsGuidedPreview.jsx",
              'const HARDWARE = ["H200", "B200", "GB200 NVL72", "B300", "GB300 NVL72"];',
              'const HARDWARE = ["H200", "B200", "GB200 NVL72", "B300", "GB300 NVL72", "RTX PRO 6000"];'
          )
          replace_once(
              "src/InferenceEconomicsGuidedPreview.jsx",
              '  "GB300 NVL72": ["FP4", "FP8", "FP16"],\n};',
              '  "GB300 NVL72": ["FP4", "FP8", "FP16"],\n  "RTX PRO 6000": ["FP4"],\n};'
          )
          replace_once(
              "src/InferenceEconomicsGuidedPreview.jsx",
              '  const inherited = handoff?.source === "tco";\n',
              '  const inherited = handoff?.source === "tco";\n  const rtxBenchmarkId = useMemo(() => (typeof window !== "undefined" ? new URLSearchParams(window.location.search).get("benchmarkId") : null), []);\n'
          )
          replace_once(
              "src/InferenceEconomicsGuidedPreview.jsx",
              '    setDeployedGpuCount(nextHardware.includes("NVL72") ? 72 : 8);',
              '    setDeployedGpuCount(nextHardware === "RTX PRO 6000" ? 2 : nextHardware.includes("NVL72") ? 72 : 8);'
          )
          replace_once(
              "src/InferenceEconomicsGuidedPreview.jsx",
              '      customParamsB,\n    });',
              '      customParamsB,\n      benchmarkId: hardwareClass === "RTX PRO 6000" ? rtxBenchmarkId : null,\n    });'
          )
          replace_once(
              "src/InferenceEconomicsGuidedPreview.jsx",
              '    hardwareClass, deployedGpuCount, quant, model, customParamsB,\n',
              '    hardwareClass, deployedGpuCount, quant, model, customParamsB, rtxBenchmarkId,\n'
          )

          # Router: RTX IE back navigation returns to the RTX TCO surface.
          replace_once(
              "src/App.jsx",
              '  const source = new URLSearchParams(location.search).get("source");\n  const backHref = source === "tco"\n    ? "/tco"\n',
              '  const params = new URLSearchParams(location.search);\n  const source = params.get("source");\n  const isRtxTco = source === "tco" && params.get("rtx") === "1";\n  const backHref = isRtxTco\n    ? "/tco/rtx-pro"\n    : source === "tco"\n      ? "/tco"\n'
          )
          replace_once(
              "src/App.jsx",
              '  const backLabel = source === "tco"\n    ? "Adjust TCO assumptions"\n',
              '  const backLabel = isRtxTco\n    ? "Adjust RTX PRO TCO inputs"\n    : source === "tco"\n      ? "Adjust TCO assumptions"\n'
          )

          # Remove this one-time workflow from the resulting branch.
          Path(".github/workflows/patch-rtx-ie-handoff.yml").unlink()
          PY
      - name: Commit guarded patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/InferenceEconomicsGuidedPreview.jsx src/App.jsx .github/workflows/patch-rtx-ie-handoff.yml
          git commit -m "Wire RTX benchmark handoff into Inference Economics"
          git push origin HEAD:feature/rtx-pro-ie-handoff
