name: Patch RTX lower-cost tier

on:
  push:
    branches:
      - feature/rtx-lower-cost-tier
    paths:
      - .github/workflows/patch-rtx-lower-cost-tier.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rtx-lower-cost-tier
          fetch-depth: 0
      - name: Apply guarded GPU Sizing presentation patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/GpuSizingCalculator.jsx')
          text = path.read_text()

          main_old = '''              <div className="flex flex-wrap gap-3 mb-6"><ResultCard icon={TrendingDown} title="Lower-cost alternative" gpuClass={result.lowerCost.class} gpus={result.lowerCost.recommended} emptyMessage="No qualifying lower-cost alternative in the current supported catalog." /><ResultCard icon={TrendingUp} title="Higher-growth alternative" gpuClass={result.higherGrowth.class} gpus={result.higherGrowth.recommended} emptyMessage="No qualifying higher-growth capacity step in the current supported catalog." subtitle={getHigherGrowthSubtitle(result.higherGrowth)} selectable={Boolean(result.higherGrowth.class && TCO_OWN_SYS_FOR_CLASS[result.higherGrowth.class])} selected={effectiveTcoSelection === "higher-growth"} onSelect={() => setTcoSelection("higher-growth")} /></div>'''
          main_new = '''              <div className="flex flex-wrap gap-3 mb-6">{mode === "Inference" ? <RtxProAlternativeCard rtxAlt={result.rtxAlt} compact /> : <ResultCard icon={TrendingDown} title="Lower-cost alternative" gpuClass={result.lowerCost.class} gpus={result.lowerCost.recommended} emptyMessage="No qualifying lower-cost alternative in the current supported catalog." />}<ResultCard icon={TrendingUp} title="Higher-growth alternative" gpuClass={result.higherGrowth.class} gpus={result.higherGrowth.recommended} emptyMessage="No qualifying higher-growth capacity step in the current supported catalog." subtitle={getHigherGrowthSubtitle(result.higherGrowth)} selectable={Boolean(result.higherGrowth.class && TCO_OWN_SYS_FOR_CLASS[result.higherGrowth.class])} selected={effectiveTcoSelection === "higher-growth"} onSelect={() => setTcoSelection("higher-growth")} /></div>'''
          if text.count(main_old) != 1:
              raise SystemExit(f'Expected exactly one calculator alternatives row, found {text.count(main_old)}')
          text = text.replace(main_old, main_new, 1)

          report_old = '''            <div className="flex flex-wrap gap-3 mb-6">
              <ResultCard icon={TrendingDown} title="Lower-cost alternative" gpuClass={result.lowerCost.class} gpus={result.lowerCost.recommended} emptyMessage="No qualifying lower-cost alternative in the current supported catalog." />
              <ResultCard icon={TrendingUp} title="Higher-growth alternative" gpuClass={result.higherGrowth.class} gpus={result.higherGrowth.recommended} emptyMessage="No qualifying higher-growth capacity step in the current supported catalog."  subtitle={getHigherGrowthSubtitle(result.higherGrowth)}/>
            </div>'''
          report_new = '''            <div className="flex flex-wrap gap-3 mb-6">
              {mode === "Inference" ? <RtxProAlternativeCard rtxAlt={result.rtxAlt} compact /> : <ResultCard icon={TrendingDown} title="Lower-cost alternative" gpuClass={result.lowerCost.class} gpus={result.lowerCost.recommended} emptyMessage="No qualifying lower-cost alternative in the current supported catalog." />}
              <ResultCard icon={TrendingUp} title="Higher-growth alternative" gpuClass={result.higherGrowth.class} gpus={result.higherGrowth.recommended} emptyMessage="No qualifying higher-growth capacity step in the current supported catalog."  subtitle={getHigherGrowthSubtitle(result.higherGrowth)}/>
            </div>'''
          if text.count(report_old) != 1:
              raise SystemExit(f'Expected exactly one report alternatives row, found {text.count(report_old)}')
          text = text.replace(report_old, report_new, 1)

          duplicate = '{mode === "Inference" && <RtxProAlternativeCard rtxAlt={result.rtxAlt} />}'
          if text.count(duplicate) != 2:
              raise SystemExit(f'Expected exactly two legacy standalone RTX cards, found {text.count(duplicate)}')
          text = text.replace(duplicate, '')

          if text.count('title="Minimum technical"') != 2:
              raise SystemExit('Unexpected Minimum technical title count')
          text = text.replace('title="Minimum technical"', 'title="Unrounded requirement"')
          if text.count('subtitle="Unrounded workload requirement"') != 2:
              raise SystemExit('Unexpected unrounded subtitle count')
          text = text.replace('subtitle="Unrounded workload requirement"', 'subtitle="Technical workload requirement before production-system rounding"')

          # Main results + report each contain the production recommendation card.
          text = text.replace('title={effectiveTcoSelection === "higher-growth" ? "Selected for TCO · Higher-growth" : "Recommended"}', 'title={effectiveTcoSelection === "higher-growth" ? "Selected for TCO · Higher-growth" : "Recommended production"}')
          text = text.replace('title="Recommended" gpuClass={result.selectedClass}', 'title="Recommended production" gpuClass={result.selectedClass}')

          path.write_text(text)
          PY
      - name: Remove temporary patch workflow and commit
        run: |
          rm .github/workflows/patch-rtx-lower-cost-tier.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/GpuSizingCalculator.jsx .github/workflows/patch-rtx-lower-cost-tier.yml
          git commit -m "Place RTX PRO in lower-cost alternative tier"
          git push origin HEAD:feature/rtx-lower-cost-tier
