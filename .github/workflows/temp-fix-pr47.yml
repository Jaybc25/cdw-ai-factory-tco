name: Temporary PR47 persistence fix

on:
  push:
    branches:
      - tco-cloud-unit-price-trend-production

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tco-cloud-unit-price-trend-production
      - name: Patch TCO persistence dependency and remove temporary workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/TcoCalculator.jsx')
          s = p.read_text()
          old = '      fastPBm, bulkPBm, egressPct, computeShare, growth, facility, powerRate, util,\n'
          new = '      fastPBm, bulkPBm, egressPct, computeShare, growth, cloudUnitPriceTrend, facility, powerRate, util,\n'
          if old in s:
              s = s.replace(old, new, 1)
              p.write_text(s)
          elif new not in s:
              raise SystemExit('Expected TCO persistence dependency line not found')
          PY
          git rm .github/workflows/temp-fix-pr47.yml
      - name: Commit source fix and cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/TcoCalculator.jsx
          git commit -m 'fix: persist cloud GPU unit-price trend changes'
          git push origin HEAD:tco-cloud-unit-price-trend-production
