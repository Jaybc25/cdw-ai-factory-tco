name: Apply cloud pricing refresh 2026-09-01 once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-cloud-pricing-refresh-20260901-once.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Cloud Pricing Refresh #1
        run: python3 scripts/apply_cloud_pricing_refresh_20260901_once.py
      - name: Verify diff
        run: |
          git diff --check
          git diff -- src/TcoCalculator.jsx src/pricingProvenance.js MaintenanceRunbook.md CHANGELOG.md
      - name: Commit refresh
        run: |
          git config user.name "ai-factory-pricing-bot"
          git config user.email "actions@github.com"
          git add src/TcoCalculator.jsx src/pricingProvenance.js MaintenanceRunbook.md CHANGELOG.md
          git commit -m "data: complete cloud pricing refresh 2026-09-01"
          git push
