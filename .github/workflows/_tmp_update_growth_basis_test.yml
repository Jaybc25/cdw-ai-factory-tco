name: Temporary update growth basis test
on:
  push:
    branches:
      - gpu-sizing-growth-selection
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpu-sizing-growth-selection
      - name: Update test expectation
        run: python .github/scripts/update_growth_basis_test_copy.py
      - name: Commit test update
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/e2e/tco-handoff-ownership.spec.js
          git commit -m "Align growth basis regression with visible copy"
          git push origin HEAD:gpu-sizing-growth-selection
