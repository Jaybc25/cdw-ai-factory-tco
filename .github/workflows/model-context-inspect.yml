name: Model context inspection

on:
  push:
    branches: [feature/shared-model-context]
    paths: ['.github/workflows/model-context-inspect.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: feature/shared-model-context }
      - name: Print relevant source regions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def show(path, needles, radius=18):
              lines = Path(path).read_text().splitlines()
              print(f"\n===== {path} =====")
              shown=set()
              for needle in needles:
                  for i,line in enumerate(lines):
                      if needle in line:
                          lo=max(0,i-radius); hi=min(len(lines),i+radius+1)
                          key=(lo,hi)
                          if key in shown: continue
                          shown.add(key)
                          print(f"\n--- around {needle!r}, line {i+1} ---")
                          for j in range(lo,hi): print(f"{j+1:5}: {lines[j]}")
          show('src/GpuSizingCalculator.jsx', ['const MODELS =', 'MODEL_ADVISOR_ID_TO_GPU_SIZING_ID', 'function TcoHandoff', '<TcoHandoff', 'const [quant, setQuant]'])
          show('src/TcoCalculator.jsx', ['const MODELS =', 'function getInitialGpuCount', 'function getInitialSourceClass', 'function getInitialWorkingDayHours', 'gpuSizingCount', 'modelSize', 'Object.keys(MODELS)', 'MODELS[inp.modelSize]', 'Capacity & unit economics'])
          show('src/ModelAdvisor.jsx', ['href={`/gpu-sizing?model=', 'RecommendationCard', 'OtherEligibleCard'])
          PY
