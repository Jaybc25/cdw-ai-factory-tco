name: Temporary cloud unit-price preview update
on:
  push:
    branches:
      - tco-cloud-unit-price-preview
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tco-cloud-unit-price-preview
      - name: Apply source, regression, and changelog updates
        run: python .github/scripts/apply_cloud_unit_price_preview.py
      - name: Remove temporary helper files
        run: rm .github/scripts/apply_cloud_unit_price_preview.py .github/workflows/_tmp_cloud_unit_price_preview.yml
      - name: Commit preview update
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Add cloud unit-price trend preview"
          git push origin HEAD:tco-cloud-unit-price-preview
