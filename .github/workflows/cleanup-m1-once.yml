name: Cleanup M1 test comment once

on:
  push:
    branches: [fix/m1-training-provenance]
    paths:
      - "scripts/cleanup-m1-test-comment.py"
      - ".github/workflows/cleanup-m1-once.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/m1-training-provenance
      - name: Clean M1 test comment
        run: python3 scripts/cleanup-m1-test-comment.py
      - name: Remove one-shot cleanup files
        run: git rm scripts/cleanup-m1-test-comment.py .github/workflows/cleanup-m1-once.yml
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/gpu-sizing-architecture-aware.spec.js
          git commit -m "Clean M1 provenance regression comment"
          git push
