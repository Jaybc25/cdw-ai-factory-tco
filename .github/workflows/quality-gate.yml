name: AI Factory quality gate

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/extract_tco_workbook_snapshot.py"
      - "scripts/run_tco_parity.mjs"
      - "scripts/validate_pricing_registry.mjs"
      - "scripts/validate_model_registry.mjs"
      - "scripts/validate_tco_handoff.mjs"
      - "docs/reverse-tco-model-v1.xlsx"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.js"
      - ".github/workflows/quality-gate.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/extract_tco_workbook_snapshot.py"
      - "scripts/run_tco_parity.mjs"
      - "scripts/validate_pricing_registry.mjs"
      - "scripts/validate_model_registry.mjs"
      - "scripts/validate_tco_handoff.mjs"
      - "docs/reverse-tco-model-v1.xlsx"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.js"
      - ".github/workflows/quality-gate.yml"

permissions:
  contents: write

jobs:
  temporary-ownership-patch:
    name: Temporary TCO ownership patch helper
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Patch TCO handoff ownership behavior
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("src/TcoCalculator.jsx")
          s = p.read_text()

          replacements = [
            (
              '  const [cloudRateOverrides, setCloudRateOverrides] = useState(() => {\n    const profiles = { ...(saved?.cloudRateOverrides ?? {}) };\n    // One-time migration from the old flat override shape: preserve the\n    // customer-entered instance rates under the provider/class they belonged\n    // to rather than deleting them when a new workload arrives.\n    const legacy = saved?.ov ?? {};\n    if ((legacy.instOD != null || legacy.instRes != null) && saved?.provider && saved?.gpuClass) {\n      const key = `${saved.provider}::${saved.gpuClass}`;\n      profiles[key] = { ...(profiles[key] ?? {}), ...(legacy.instOD != null ? { instOD: legacy.instOD } : {}), ...(legacy.instRes != null ? { instRes: legacy.instRes } : {}) };\n    }\n    return profiles;\n  });\n  const [ov, setOv] = useState(() => {\n    const next = { ...(saved?.ov ?? {}) };\n    delete next.instOD;\n    delete next.instRes;\n    return next;\n  });',
              '  const [cloudRateOverrides, setCloudRateOverrides] = useState(() => {\n    const profiles = { ...(saved?.cloudRateOverrides ?? {}) };\n    // One-time migration from the old flat override shape: preserve the\n    // customer-entered instance rates under the provider/class they belonged\n    // to rather than deleting them when a new workload arrives.\n    const legacy = saved?.ov ?? {};\n    if ((legacy.instOD != null || legacy.instRes != null) && saved?.provider && saved?.gpuClass) {\n      const key = `${saved.provider}::${saved.gpuClass}`;\n      profiles[key] = { ...(profiles[key] ?? {}), ...(legacy.instOD != null ? { instOD: legacy.instOD } : {}), ...(legacy.instRes != null ? { instRes: legacy.instRes } : {}) };\n    }\n    return profiles;\n  });\n  const [onPremRateOverrides, setOnPremRateOverrides] = useState(() => {\n    const profiles = { ...(saved?.onPremRateOverrides ?? {}) };\n    // Loaded system cost, system power, and Equinix bundle are tied to the\n    // on-prem system. Preserve old edits, but only apply them again when that\n    // same system is active so a new GPU Sizing target cannot inherit the\n    // previous hardware\'s economics.\n    const legacy = saved?.ov ?? {};\n    if ((legacy.perSysCost != null || legacy.sysKw != null || legacy.equinixMo != null) && saved?.ownSys) {\n      const key = saved.ownSys;\n      profiles[key] = {\n        ...(profiles[key] ?? {}),\n        ...(legacy.perSysCost != null ? { perSysCost: legacy.perSysCost } : {}),\n        ...(legacy.sysKw != null ? { sysKw: legacy.sysKw } : {}),\n        ...(legacy.equinixMo != null ? { equinixMo: legacy.equinixMo } : {}),\n      };\n    }\n    return profiles;\n  });\n  const [ov, setOv] = useState(() => {\n    const next = { ...(saved?.ov ?? {}) };\n    delete next.instOD;\n    delete next.instRes;\n    delete next.perSysCost;\n    delete next.sysKw;\n    delete next.equinixMo;\n    return next;\n  });'
            ),
            (
              '      ov, cloudRateOverrides, cloudGpuClassOverridden, bill, provider, gpuClass, ownSys, mode, trainShare, odShare, storageAuto,',
              '      ov, cloudRateOverrides, onPremRateOverrides, cloudGpuClassOverridden, bill, provider, gpuClass, ownSys, mode, trainShare, odShare, storageAuto,'
            ),
            (
              '  }, [ov, cloudRateOverrides, cloudGpuClassOverridden, bill, provider, gpuClass, ownSys, mode, trainShare, odShare, storageAuto,',
              '  }, [ov, cloudRateOverrides, onPremRateOverrides, cloudGpuClassOverridden, bill, provider, gpuClass, ownSys, mode, trainShare, odShare, storageAuto,'
            ),
            (
              '  const defaults = defaultsFor(provider, gpuClass, ownSys);\n  const cloudRateProfileKey = `${provider}::${gpuClass}`;\n  const activeCloudRateOverride = cloudRateOverrides[cloudRateProfileKey] ?? {};\n  const rc = { ...defaults, ...ov, ...activeCloudRateOverride };\n  const editedCount = Object.keys(ov).length + Object.keys(activeCloudRateOverride).length;\n  const setActiveCloudRateOverride = (next) => setCloudRateOverrides((profiles) => ({ ...profiles, [cloudRateProfileKey]: next }));',
              '  const defaults = defaultsFor(provider, gpuClass, ownSys);\n  const cloudRateProfileKey = `${provider}::${gpuClass}`;\n  const onPremRateProfileKey = ownSys;\n  const activeCloudRateOverride = cloudRateOverrides[cloudRateProfileKey] ?? {};\n  const activeOnPremRateOverride = onPremRateOverrides[onPremRateProfileKey] ?? {};\n  const rc = { ...defaults, ...ov, ...activeCloudRateOverride, ...activeOnPremRateOverride };\n  const editedCount = Object.keys(ov).length + Object.keys(activeCloudRateOverride).length + Object.keys(activeOnPremRateOverride).length;\n  const setActiveCloudRateOverride = (next) => setCloudRateOverrides((profiles) => ({ ...profiles, [cloudRateProfileKey]: next }));\n  const setActiveOnPremRateOverride = (next) => setOnPremRateOverrides((profiles) => ({ ...profiles, [onPremRateProfileKey]: next }));\n  const resetActiveRateEdits = () => {\n    setOv({});\n    setCloudRateOverrides((profiles) => { const next = { ...profiles }; delete next[cloudRateProfileKey]; return next; });\n    setOnPremRateOverrides((profiles) => { const next = { ...profiles }; delete next[onPremRateProfileKey]; return next; });\n  };'
            ),
            (
              '            Cloud instance rates auto-fill from the {provider} × {gpuClass} list table (as of {RATES_ASOF}); on-prem defaults = NVIDIA DGX TCO tool ({ONPREM_ASOF}). Cloud instance-rate edits are saved by provider + GPU class, so workload changes do not erase customer-entered pricing.',
              '            Cloud instance rates auto-fill from the {provider} × {gpuClass} list table (as of {RATES_ASOF}); on-prem defaults = NVIDIA DGX TCO tool ({ONPREM_ASOF}). Cloud instance-rate edits are saved by provider + GPU class, and system-specific on-prem edits are saved by target system, so workload changes do not erase customer-entered pricing or misapply it to different hardware.'
            ),
            (
              '            <button onClick={() => { setOv({}); setCloudRateOverrides({}); }}',
              '            <button onClick={resetActiveRateEdits}'
            ),
            (
              '              Reset all {editedCount} to defaults',
              '              Reset current scenario edits ({editedCount})'
            ),
            (
              '<RateField k="perSysCost" label={`${ownSys} loaded cost $ (system + SW + fabrics + svcs; excl. cluster & racks)`} eff={rc} defaults={defaults} ov={ov} setOv={setOv} step={1000} fmt={fmt} />',
              '<RateField k="perSysCost" label={`${ownSys} loaded cost $ (system + SW + fabrics + svcs; excl. cluster & racks)`} eff={rc} defaults={defaults} ov={activeOnPremRateOverride} setOv={setActiveOnPremRateOverride} step={1000} fmt={fmt} />'
            ),
            (
              '<RateField k="sysKw" label={`Power kW per ${ownSys} (avg load)`} eff={rc} defaults={defaults} ov={ov} setOv={setOv} step={0.1} />\n          <RateField k="equinixMo" label="Equinix bundle $/system/mo" eff={rc} defaults={defaults} ov={ov} setOv={setOv} step={100} fmt={fmt} />',
              '<RateField k="sysKw" label={`Power kW per ${ownSys} (avg load)`} eff={rc} defaults={defaults} ov={activeOnPremRateOverride} setOv={setActiveOnPremRateOverride} step={0.1} />\n          <RateField k="equinixMo" label="Equinix bundle $/system/mo" eff={rc} defaults={defaults} ov={activeOnPremRateOverride} setOv={setActiveOnPremRateOverride} step={100} fmt={fmt} />'
            ),
          ]

          changed = False
          for old, new in replacements:
            if new in s:
              continue
            if old not in s:
              raise SystemExit(f"Expected source pattern not found:\n{old}")
            s = s.replace(old, new, 1)
            changed = True

          if changed:
            p.write_text(s)
            print("Patched src/TcoCalculator.jsx")
          else:
            print("TCO ownership patch already present")
          PY

      - name: Commit patch to PR branch when needed
        run: |
          if git diff --quiet -- src/TcoCalculator.jsx; then
            echo "No source patch commit needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/TcoCalculator.jsx
          git commit -m "fix: preserve system-scoped TCO rate edits"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  source-and-workbook:
    name: Build + TCO Excel parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Validate shared pricing registry
        run: node scripts/validate_pricing_registry.mjs

      - name: Validate shared model registry
        run: node scripts/validate_model_registry.mjs

      - name: Validate TCO GPU Sizing handoff defaults
        run: node scripts/validate_tco_handoff.mjs

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Extract checked-in TCO workbook snapshot
        run: python3 scripts/extract_tco_workbook_snapshot.py

      - name: Verify final audit workbook structure
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          p = Path("tests/tco-parity/workbook_snapshot.json")
          data = json.loads(p.read_text())
          names = [s["name"] for s in data["sheets"]]
          required = {"Inputs", "Engine", "Results", "Validation", "EngineRegression", "Crossover"}
          missing = sorted(required - set(names))
          if missing:
            raise SystemExit(f"TCO workbook missing required audit sheets: {missing}. Present: {names}")
          print("Workbook sheets:", ", ".join(names))
          PY

      - name: Run Excel-to-JS parity gate
        run: node scripts/run_tco_parity.mjs

      - name: Upload workbook snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tco-workbook-snapshot
          path: tests/tco-parity/workbook_snapshot.json
          if-no-files-found: error
          retention-days: 14

  branch-handoff-e2e:
    name: PR TCO handoff ownership browser regression
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Install Playwright test runner
        run: npm install --no-save --no-package-lock @playwright/test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build current PR source
        run: npm run build

      - name: Start local production preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/tco-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/tco >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/tco-preview.log
          exit 1

      - name: Run handoff ownership journeys against PR build
        env:
          BASE_URL: http://127.0.0.1:4173
        run: npx playwright test tests/e2e/tco-handoff-ownership.spec.js

  live-smoke:
    name: Live Vercel browser regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Install Playwright test runner
        run: npm install --no-save --no-package-lock @playwright/test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run complete live regression suite
        env:
          BASE_URL: https://cdw-ai-factory-tco.vercel.app
        run: npx playwright test tests/e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 14
