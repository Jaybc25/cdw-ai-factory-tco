name: AI Factory quality gate

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/extract_tco_workbook_snapshot.py"
      - "scripts/run_tco_parity.mjs"
      - "scripts/validate_pricing_registry.mjs"
      - "scripts/validate_model_registry.mjs"
      - "docs/reverse-tco-model-v1.xlsx"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.js"
      - ".github/workflows/quality-gate.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/extract_tco_workbook_snapshot.py"
      - "scripts/run_tco_parity.mjs"
      - "scripts/validate_pricing_registry.mjs"
      - "scripts/validate_model_registry.mjs"
      - "docs/reverse-tco-model-v1.xlsx"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.js"
      - ".github/workflows/quality-gate.yml"

permissions:
  contents: write

jobs:
  temporary-handoff-patch:
    name: Temporary TCO handoff patch helper
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Patch TCO like-for-like cloud initialization
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("src/TcoCalculator.jsx")
          s = p.read_text()

          replacements = [
            (
              '  const [sourceClass] = useState(() => getInitialSourceClass() ?? saved?.sourceClass ?? null);\n  const [workingDayHours] = useState(() => getInitialWorkingDayHours() ?? saved?.workingDayHours ?? null);',
              '  const [sourceClass] = useState(() => getInitialSourceClass() ?? saved?.sourceClass ?? null);\n  const matchedCloudGpuClass = sourceClass ? normalizeSourceClass(sourceClass) : null;\n  const [workingDayHours] = useState(() => getInitialWorkingDayHours() ?? saved?.workingDayHours ?? null);'
            ),
            (
              '  const [ov, setOv] = useState(saved?.ov ?? {});',
              '  const [ov, setOv] = useState(() => {\n    const next = { ...(saved?.ov ?? {}) };\n    // A fresh GPU Sizing handoff establishes a new cloud comparison basis.\n    // Keep unrelated TCO refinements, but do not carry class-specific manual\n    // cloud-rate overrides from an older TCO scenario into the new workload.\n    if (arrivedFromGpuSizing) {\n      delete next.instOD;\n      delete next.instRes;\n    }\n    return next;\n  });'
            ),
            (
              '  const [gpuClass, setGpuClass] = useState(saved?.gpuClass ?? "H100");',
              '  const [gpuClass, setGpuClass] = useState(() => {\n    // Workload handoffs start like-for-like: the cloud rental class matches\n    // the class GPU Sizing used for its technical recommendation. Saved TCO\n    // cloud-class history only applies when this is not a fresh handoff.\n    if (arrivedFromGpuSizing && matchedCloudGpuClass && RATES[provider]?.[matchedCloudGpuClass]) {\n      return matchedCloudGpuClass;\n    }\n    return saved?.gpuClass ?? "H100";\n  });'
            ),
            (
              '          <div style={{ fontSize: 11, color: C.sub, marginTop: -2 }}>\n            Sets both the performance factor AND the rate used to reconstruct their GPU-hours from spend.\n          </div>',
              '          {mode === "workload" && matchedCloudGpuClass ? (\n            <div style={{ fontSize: 11, color: C.sub, marginTop: -2 }}>\n              {gpuClass === matchedCloudGpuClass\n                ? `Matched to ${sourceClass} from GPU Sizing for a like-for-like starting comparison. Change this only if the proposed cloud rental uses a different GPU class; the technical on-prem fleet remains anchored to GPU Sizing.`\n                : `Cloud comparison changed from the ${sourceClass} workload basis to ${gpuClass}. This changes cloud pricing and workload-equivalent rental hours, not the technical on-prem fleet from GPU Sizing.`}\n            </div>\n          ) : (\n            <div style={{ fontSize: 11, color: C.sub, marginTop: -2 }}>\n              Sets both the performance factor AND the rate used to reconstruct their GPU-hours from spend.\n            </div>\n          )}'
            ),
          ]

          changed = False
          for old, new in replacements:
            if new in s:
              continue
            if old not in s:
              raise SystemExit(f"Expected TCO source pattern not found:\n{old}")
            s = s.replace(old, new, 1)
            changed = True

          if changed:
            p.write_text(s)
            print("Patched src/TcoCalculator.jsx")
          else:
            print("TCO patch already present")
          PY

      - name: Commit patch to PR branch when needed
        run: |
          if git diff --quiet -- src/TcoCalculator.jsx; then
            echo "No TCO patch commit needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/TcoCalculator.jsx
          git commit -m "fix: match TCO cloud class to GPU sizing"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  source-and-workbook:
    name: Build + TCO Excel parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Validate shared pricing registry
        run: node scripts/validate_pricing_registry.mjs

      - name: Validate shared model registry
        run: node scripts/validate_model_registry.mjs

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Extract checked-in TCO workbook snapshot
        run: python3 scripts/extract_tco_workbook_snapshot.py

      - name: Verify final audit workbook structure
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          p = Path("tests/tco-parity/workbook_snapshot.json")
          data = json.loads(p.read_text())
          names = [s["name"] for s in data["sheets"]]
          required = {"Inputs", "Engine", "Results", "Validation", "EngineRegression", "Crossover"}
          missing = sorted(required - set(names))
          if missing:
            raise SystemExit(f"TCO workbook missing required audit sheets: {missing}. Present: {names}")
          print("Workbook sheets:", ", ".join(names))
          PY

      - name: Run Excel-to-JS parity gate
        run: node scripts/run_tco_parity.mjs

      - name: Upload workbook snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tco-workbook-snapshot
          path: tests/tco-parity/workbook_snapshot.json
          if-no-files-found: error
          retention-days: 14

  live-smoke:
    name: Live Vercel browser regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Install Playwright test runner
        run: npm install --no-save --no-package-lock @playwright/test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run complete live regression suite
        env:
          BASE_URL: https://cdw-ai-factory-tco.vercel.app
        run: npx playwright test tests/e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 14
