name: Project record catch-up

on:
  push:
    branches:
      - docs/project-record-catchup-2026-09-05
    paths:
      - .github/workflows/project-record-catchup.yml

permissions:
  contents: write

jobs:
  update-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/project-record-catchup-2026-09-05
      - name: Update durable project records
        run: |
          python scripts/project_record_catchup.py
          rm .github/workflows/project-record-catchup.yml scripts/project_record_catchup.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: catch up durable project record through PR 24"
          git push origin HEAD:docs/project-record-catchup-2026-09-05
      # One-time documentation-only maintenance workflow.
