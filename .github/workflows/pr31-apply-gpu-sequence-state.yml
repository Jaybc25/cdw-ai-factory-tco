name: PR31 apply GPU sequence-state patch

on:
  push:
    branches: [hybrid-sequence-state-methodology]
    paths:
      - ".github/workflows/pr31-apply-gpu-sequence-state.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hybrid-sequence-state-methodology
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply exact source patch
        run: node scripts/apply_pr31_gpu_sequence_state_patch.mjs
      - name: Commit patched calculator
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/GpuSizingCalculator.jsx
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No calculator changes produced."
            exit 1
          fi
          git commit -m "Integrate shared sequence-state memory into GPU sizing"
          git push origin HEAD:hybrid-sequence-state-methodology
