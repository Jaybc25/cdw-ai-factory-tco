name: Apply M1 training provenance fix once

on:
  push:
    branches: [fix/m1-training-provenance]
    paths:
      - "scripts/apply-m1-training-provenance.py"
      - ".github/workflows/apply-m1-once.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/m1-training-provenance
      - name: Apply M1 provenance patch
        run: python3 scripts/apply-m1-training-provenance.py
      - name: Remove one-shot patch files
        run: git rm scripts/apply-m1-training-provenance.py .github/workflows/apply-m1-once.yml
      - name: Commit M1 provenance fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/GpuSizingCalculator.jsx tests/e2e/gpu-sizing-architecture-aware.spec.js
          git commit -m "Fix M1 training performance provenance"
          git push
