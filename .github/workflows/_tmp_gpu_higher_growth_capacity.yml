name: Temporary GPU higher-growth capacity patch

on:
  push:
    branches: [gpu-sizing-higher-growth-capacity]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpu-sizing-higher-growth-capacity
      - name: Apply patch
        run: python3 .github/scripts/apply_gpu_higher_growth_capacity.py
      - name: Remove temporary helper
        run: rm .github/scripts/apply_gpu_higher_growth_capacity.py .github/workflows/_tmp_gpu_higher_growth_capacity.yml
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: redefine higher-growth as deployable capacity"
          git push origin HEAD:gpu-sizing-higher-growth-capacity
