name: Npm audit review once

on:
  push:
    paths:
      - '.github/workflows/npm-audit-review-once.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Capture npm audit JSON
        shell: bash
        run: |
          set +e
          npm audit --json > npm-audit.json
          status=$?
          echo "npm audit exit code: $status"
          test -s npm-audit.json
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-review
          path: npm-audit.json
          if-no-files-found: error
          retention-days: 7
